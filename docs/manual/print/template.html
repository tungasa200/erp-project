<!doctype html>
<!--
  매뉴얼 PDF 틀 (WY-design). 생성 스크립트(WY-planner, docs/tools)가 자리 표시를 문자열로 바꾸고
  결과 HTML을 이 폴더(docs/manual/print/)에 만든 뒤 headless Chrome으로 인쇄한다.
  자리 표시: {{TITLE}} {{EDITION}} {{COVER}} {{TOC}} {{BODY}}
  글꼴: frontend/node_modules/pretendard (새 글꼴 파일·CDN 없음). frontend에서 npm install이 되어 있어야 한다.
  Chrome 옵션: --no-pdf-header-footer (쪽 번호·머리글은 print.css의 @page 여백 상자)
-->
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>{{TITLE}}</title>
    <link rel="stylesheet" href="../../../frontend/node_modules/pretendard/dist/web/variable/pretendardvariable.css" />
    <link rel="stylesheet" href="print.css" />
  </head>
  <body>
    <section class="cover">
      <div class="cover-brand" aria-hidden="true">
        <span class="cover-logo">w</span>
        <span class="cover-name">worklog</span>
      </div>
      <div class="cover-main">
        <p class="cover-kicker">사용 설명서</p>
        {{COVER}}
      </div>
      <div class="cover-foot">
        <span>판 {{EDITION}}</span>
        <span>wy-worklog.com</span>
      </div>
    </section>

    <section class="toc-sheet">
      <h1 class="toc-heading">차례</h1>
      {{TOC}}
    </section>

    <main>{{BODY}}</main>
  </body>
</html>
