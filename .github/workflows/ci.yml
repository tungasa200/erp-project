# PR마다 백엔드 빌드·테스트와 프론트 빌드·린트·테스트를 돌린다 (P0-08).
# 명세 스냅샷(contracts/generated/*.json) 일치는 백엔드 test가 검사한다: springdoc 출력이 스냅샷과 다르면 실패한다.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    # ubuntu-latest가 2026-10-19부터 26으로 바뀐다. P0 동안 고정하고 P0 병합 뒤 올린다
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      # 통합 테스트는 Testcontainers로 PostgreSQL을 띄운다. ubuntu 러너에는 Docker가 있다.
      - run: ./gradlew build --console=plain
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: backend-test-reports
          path: backend/*/build/reports/tests/
          retention-days: 7

  # 운영 이미지가 저장소 루트 문맥으로 빌드되는지 확인한다(push 없음). 테스트는 backend job이 돌린다.
  docker-image:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, identity-service, worklog-service]
    steps:
      - uses: actions/checkout@v5
      - name: 이미지 빌드
        run: docker build -f backend/Dockerfile --build-arg SERVICE=${{ matrix.service }} -t ci/${{ matrix.service }} .
      # worklog는 공휴일 파일(shared/holidays/KR.json, D-74)을 jar에 넣어 classpath:holidays/KR.json으로 읽는다
      - name: 공휴일 파일 포함 확인
        if: matrix.service == 'worklog-service'
        run: |
          id=$(docker create ci/worklog-service)
          docker cp "$id":/app/app.jar app.jar
          docker rm "$id"
          unzip -l app.jar | grep -q 'BOOT-INF/classes/holidays/KR.json'

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # 생성 타입(src/api/generated)이 명세 스냅샷과 같은지 검사한다. 다르면 로컬에서 npm run gen:api 후 함께 커밋한다.
      - name: 생성 타입 일치 검사
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/generated
          test -z "$(git status --porcelain -- src/api/generated)"
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
