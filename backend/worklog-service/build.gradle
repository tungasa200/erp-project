plugins {
	alias(libs.plugins.spring.boot)
}

dependencies {
	// common이 webmvc·validation·추적(Brave)·ShedLock을 api로 내보낸다.
	implementation project(':common')
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	implementation libs.springdoc.webmvc.api
	// 일지 내보내기 (D-111): PDF는 OpenPDF(MPL-2.0 선택), Word·Excel은 Apache POI
	implementation 'com.github.librepdf:openpdf:3.0.5'
	implementation 'org.apache.poi:poi-ooxml:5.5.1'
	// 웹 푸시 (P4-01, 카드 0400): VAPID 서명·메시지 암호화. MIT, 런타임 의존성 없음(JDK HttpClient로 보낸다)
	implementation 'com.zerodeplibs:zerodep-web-push-java:2.1.5'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'

	testImplementation testFixtures(project(':common'))
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
}

// 공휴일(D-74)은 저장소 루트 shared/holidays/KR.json 하나를 프론트와 함께 쓴다. jar의 holidays/KR.json으로 넣는다.
// Docker 빌드 단계에도 저장소 배치(backend/, shared/)가 있어야 한다.
tasks.named('processResources') {
	from(rootProject.file('../shared/holidays')) {
		include 'KR.json'
		into 'holidays'
	}
}
