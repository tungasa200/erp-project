plugins {
	alias(libs.plugins.spring.boot) apply false
	alias(libs.plugins.spring.dependency.management) apply false
}

// subprojects 블록 안에서 libs를 참조하면 하위 모듈이 루트 속성을 암묵적으로 찾게 되어(Gradle 10에서 오류) 밖에서 꺼내 둔다.
def springBootVersion = libs.versions.spring.boot.get()
def springCloudVersion = libs.versions.spring.cloud.get()

// 모든 모듈 공통: Java 21 toolchain, Spring Boot·Spring Cloud BOM, JUnit 5.
// 각 모듈은 자기 build.gradle에서 java-library 또는 org.springframework.boot 플러그인과 의존성만 추가한다.
subprojects {
	apply plugin: 'java'
	apply plugin: 'io.spring.dependency-management'

	group = 'com.erp'
	version = '0.0.1-SNAPSHOT'

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(21)
		}
	}

	repositories {
		mavenCentral()
	}

	dependencyManagement {
		imports {
			mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
			mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
		}
	}

	dependencies {
		testImplementation 'org.springframework.boot:spring-boot-starter-test'
		testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	}

	tasks.withType(JavaCompile).configureEach {
		options.encoding = 'UTF-8'
		options.compilerArgs << '-parameters'
	}

	tasks.named('test') {
		useJUnitPlatform()
	}
}
