openapi: 3.1.0
info:
  title: identity-service API
  version: 0.3.0-draft
  description: |
    구현 전 합의용 초안 (P0 범위: P0-05 인증, P0-11 내부 API. P1 범위: P1-01 프로필 수정, P1-12 이메일 인증, P1-13 비밀번호 재설정. P4 범위: P4-08 비밀번호 변경, P4-05 회원 탈퇴). 구현 후에는 springdoc 출력이 기준이다 (P0-10).
    규약은 요구사항정의서 5.5를 따른다: 버전 없는 모듈 접두사(/api/auth, /api/users/me), 시각은 UTC ISO-8601,
    시간대는 IANA 이름, camelCase, 오류는 RFC 9457 Problem Details + code·errors[]·traceId.

    ■ 쿠키 (D-16, NFR-02)
    - access_token: HttpOnly; Secure; SameSite=Strict; Path=/api; Max-Age=600
    - refresh_token: HttpOnly; Secure; SameSite=Strict; Path=/api/auth; Max-Age=1209600
    - Domain은 지정하지 않는다(host-only). 프론트는 토큰 값을 다루지 않는다.
    - 쿠키를 지울 때는 같은 이름·Path로 Max-Age=0을 보낸다.

    ■ 인증 경로별 처리
    - /api/auth/**: Gateway가 토큰을 검증하지 않고 쿠키를 그대로 넘긴다. 로그인이 필요한 auth 경로는
      identity가 access_token 쿠키를 직접 검증한다.
    - /api/users/me/**: Gateway가 access_token 쿠키를 Authorization: Bearer로 옮겨 전달하고, identity가 다시 검증한다 (D-19).
      worklog가 사본이 없을 때 사용자 토큰을 그대로 실어 내부 주소로 호출하는 경로이기도 하다.
    - /internal/**, /.well-known/**: Gateway가 외부로 라우팅하지 않는다. Railway private network(로컬은 localhost:8081)로만 호출한다.

    ■ JWT (RS256, D-18)
    - 헤더: alg=RS256, kid
    - 사용자 토큰: iss=erp-identity, aud=erp-api, sub=사용자 ID(UUIDv7), iat, exp(10분). scope 없음.
    - 서비스 토큰 (D-29): iss=erp-identity, aud=erp-internal, sub=service:<client_id>, scope(공백 구분), iat, exp(5분).
    - 검증 측: 사용자 API는 aud=erp-api만 허용한다. /internal/**은 aud=erp-internal이면서 필요한 scope가 있어야 한다.
servers:
  - url: /
tags:
  - name: auth
    description: 가입·로그인·토큰 갱신·로그아웃·비밀번호 재설정·변경 (AUTH-01, AUTH-02, AUTH-03, AUTH-07, AUTH-09)
  - name: me
    description: 현재 사용자 공통 프로필 (identity가 원본, D-27)
  - name: jwks
    description: JWT 공개키 (내부 전용)
  - name: internal
    description: 서비스 간 API (client credentials 서비스 토큰, D-28·D-29)
paths:
  /api/auth/signup:
    post:
      tags: [auth]
      operationId: signup
      summary: 회원 가입 후 바로 로그인
      description: |
        가입에 성공하면 자동으로 로그인 상태가 된다(쿠키 2종 발급). 이메일 인증은 막지 않는다 (D-20).
        이메일은 앞뒤 공백을 지우고 소문자로 바꿔 저장·비교한다.
        비밀번호 확인 입력 일치는 프론트에서만 검사한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: 가입·로그인 성공
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetAuthCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '409':
          description: 이미 가입된 이메일 (code=EMAIL_ALREADY_EXISTS). 화면은 로그인 링크를 안내한다 (SCR-AUTH-03).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/OriginRejected'
  /api/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: 이메일·비밀번호 로그인
      description: |
        성공하면 새 로그인 세션(refresh family)을 만들고 쿠키 2종을 발급한다.
        연속 실패 시 응답이 점점 늦어지고, 10회 실패하면 15분 잠근다 (AUTH-09, P1-14에서 구현. 응답 형식은 지금 확정).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인 성공
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetAuthCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          description: |
            이메일 또는 비밀번호가 맞지 않음 (code=INVALID_CREDENTIALS). 어느 쪽이 틀렸는지 구분하지 않으며,
            없는 이메일도 같은 응답을 같은 시간대로 돌려준다.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: |
            계정 잠금(code=AUTH_LOCKED) 또는 IP 단위 시도 제한(code=TOO_MANY_REQUESTS).
            남은 시간은 Retry-After 헤더(초)와 본문 retryAfterSeconds로 준다.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RateLimitedProblem'
        '403':
          $ref: '#/components/responses/OriginRejected'
  /api/auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Access Token 갱신 (Refresh Token rotation)
      description: |
        refresh_token 쿠키로 호출한다. 본문은 없다.
        - 정상: 기존 refresh를 폐기하고 같은 family로 새 refresh와 새 access를 발급한다.
        - 30초 유예: 방금 교체된 직전 refresh가 30초 안에 다시 오면(여러 탭 동시 갱신) 탈취로 보지 않는다.
          이때는 새 access_token만 발급하고 refresh_token 쿠키는 보내지 않는다. 브라우저에는 먼저 끝난 요청이
          받은 새 refresh 쿠키가 이미 저장되어 있기 때문이다.
        - 재사용 탐지: 그 외에 이미 폐기된 refresh가 오면 family 전체를 폐기하고 401을 준다.
        401이면 쿠키 2종을 지운다. 프론트는 로그인 화면으로 보낸다(P0-07).
      responses:
        '204':
          description: 갱신 성공. access_token은 항상, refresh_token은 정상 rotation일 때만 Set-Cookie로 온다.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetAuthCookies'
        '401':
          description: |
            refresh 쿠키 없음·만료·폐기·재사용 탐지 (code=REFRESH_INVALID). 탈퇴한 사용자도 같다
            (탈퇴 시 Refresh Token을 함께 지우므로 구분할 수 없다).
            재사용 탐지 여부는 응답으로 구분하지 않는다.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearAuthCookies'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/OriginRejected'
  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: 로그아웃
      description: |
        refresh_token 쿠키의 family(현재 로그인 세션)를 폐기하고 쿠키 2종을 지운다.
        access가 만료된 상태에서도 동작해야 하므로 refresh 쿠키만 본다. 쿠키가 없거나 이미 폐기됐어도 204를 준다.
        이미 발급된 access는 수명(10분) 동안 남는다 (D-17, 즉시 무효화는 Redis 도입 때).
      responses:
        '204':
          description: 로그아웃 완료
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearAuthCookies'
        '403':
          $ref: '#/components/responses/OriginRejected'
  /api/auth/password-reset:
    post:
      tags: [auth]
      operationId: requestPasswordReset
      summary: 비밀번호 재설정 코드 메일 요청 (AUTH-03, P1-13, SCR-AUTH-04)
      description: |
        가입된 이메일이면 6자리 재설정 코드를 새로 만들어 메일로 보낸다(SCR-MAIL-02, 제목에 코드 없음, D-41). 이전 재설정 코드는 무효가 된다.
        가입 여부와 관계없이 같은 202 응답을 준다. 없는 이메일이면 메일을 보내지 않고 같은 형식의 시각을 돌려준다.
        발송 제한(이메일 인증과 같은 규칙): 같은 계정에 60초 간격, 24시간에 10통. 넘으면 429.
        (발송 제한은 가입된 계정에만 걸리므로 429로 계정 존재가 드러날 수 있다. D-61과 같은 판단으로 받아들인다.)
        메일은 커밋 뒤 보내며(D-53), 발송 실패는 응답에 영향을 주지 않는다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          description: 접수 (가입 여부 비노출)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeIssued'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '403':
          $ref: '#/components/responses/OriginRejected'
        '429':
          $ref: '#/components/responses/SendLimited'
  /api/auth/password-reset/verify:
    post:
      tags: [auth]
      operationId: verifyPasswordResetCode
      summary: 재설정 코드 확인 (새 비밀번호 입력 단계로 넘어가기 전)
      description: |
        코드가 맞는지만 확인하고 코드를 쓰지 않는다(confirm에서 다시 확인한다). 틀리면 시도 횟수가 준다(5회).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeCheckRequest'
      responses:
        '204':
          description: 코드가 맞음
        '400':
          $ref: '#/components/responses/CodeRejected'
        '403':
          $ref: '#/components/responses/OriginRejected'
  /api/auth/password-reset/confirm:
    post:
      tags: [auth]
      operationId: confirmPasswordReset
      summary: 코드로 새 비밀번호 저장
      description: |
        코드를 다시 확인하고 새 비밀번호(D-38 규칙)를 저장한다. 성공하면
        - 이메일 인증도 완료 처리한다 (메일 소유 증명, 미인증 계정 되찾기 — AUTH-03·08)
        - 그 사용자의 모든 로그인 세션(Refresh Token)을 폐기하고 이 브라우저의 쿠키 2종도 지운다. 화면은 로그인 화면으로 보낸다.
          이미 발급된 Access Token은 수명(10분) 동안 남는다 (D-17).
        - 로그인 실패 횟수와 잠금(AUTH-09)을 지운다.
        - 코드를 쓴 것으로 처리한다(재사용 불가).
        코드 오류(400 CodeRejected)와 비밀번호 규칙 오류(400 VALIDATION_FAILED)는 code로 구분한다. 코드를 먼저 확인한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
      responses:
        '204':
          description: 저장 완료
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearAuthCookies'
        '400':
          description: 코드 오류(CODE_MISMATCH·CODE_EXPIRED, CodeRejected 참고) 또는 VALIDATION_FAILED(비밀번호 규칙, errors[]는 ValidationFailed 참고)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/CodeRejectedProblem'
        '403':
          $ref: '#/components/responses/OriginRejected'
  /api/auth/password-change:
    post:
      tags: [auth]
      operationId: changePassword
      summary: 비밀번호 변경 (AUTH-07, P4-08, SCR-SET-06 ②)
      description: |
        로그인 상태에서 현재 비밀번호를 확인한 뒤 새 비밀번호(D-38 규칙)로 바꾼다. 새 비밀번호 확인 칸은 화면에서만 비교하고 보내지 않는다.
        /api/auth 아래에 두는 까닭: 현재 기기의 로그인 세션을 알려면 refresh_token 쿠키가 필요한데 그 쿠키는 Path=/api/auth로만 온다.
        Gateway는 검증하지 않고, identity가 access_token 쿠키를 직접 검증한다(info의 인증 경로별 처리).

        확인 순서: access 검증(401) → 시도 제한(429) → 현재 비밀번호(400 CURRENT_PASSWORD_MISMATCH) → 새 비밀번호 규칙(400 VALIDATION_FAILED).
        현재 비밀번호가 틀리면 새 비밀번호 규칙은 보지 않는다.

        성공하면
        - 새 비밀번호 해시를 저장한다.
        - 세션 처리(확정 2026-10-11 카드 0300, AUTH-07 "다른 기기의 로그인 세션 폐기", 화면정의서 SET-06 "현재 기기는 로그인 유지"):
          요청의 refresh_token 쿠키가 이 사용자의 유효한 family이면 그 family만 남기고 나머지 family를 모두 폐기한다.
          현재 기기의 쿠키는 바꾸지 않는다(currentSessionKept=true).
          refresh 쿠키가 없거나 유효하지 않으면 현재 기기를 가려낼 수 없어 모든 family를 폐기하고 쿠키 2종을 지운다
          (currentSessionKept=false, 화면은 로그인 화면으로 보낸다).
        - 다른 기기에서 이미 발급된 Access Token은 수명(10분) 동안 남는다 (D-17, 즉시 무효화는 Redis 도입 때).
        - 현재 비밀번호 불일치 횟수를 지운다. 로그인 실패 횟수·잠금(AUTH-09)은 건드리지 않는다.
        - 사용자 변경 피드에는 남기지 않는다(Profile에 없는 값). 변경 알림 메일은 보내지 않는다(요구사항에 없음).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '200':
          description: 변경 완료. currentSessionKept=false이면 쿠키 2종을 지운 응답이다.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearAuthCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordChanged'
        '400':
          description: |
            - CURRENT_PASSWORD_MISMATCH: 현재 비밀번호가 틀림. errors[]에 field=currentPassword, code=CURRENT_PASSWORD_MISMATCH 하나.
              화면은 현재 비밀번호 칸 아래 인라인 오류(SET-06). 불일치 횟수가 1 오른다.
            - VALIDATION_FAILED: 칸 없음(REQUIRED) 또는 새 비밀번호 규칙. errors[].field는 currentPassword·newPassword,
              code는 ValidationFailed의 PASSWORD_LENGTH·PASSWORD_TOO_LONG_BYTES·PASSWORD_LETTER_DIGIT_REQUIRED·PASSWORD_SAME_AS_EMAIL과
              PASSWORD_SAME_AS_CURRENT(새 비밀번호가 현재 비밀번호와 같음). 규칙을 여러 개 어기면 모두 넣는다.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OriginRejected'
        '429':
          description: |
            비밀번호 재확인 불일치가 15분 안에 5회면 15분 동안 막는다 (code=PASSWORD_CHANGE_LOCKED). 회원 탈퇴(/api/users/me/deletion)와 횟수를 합산하고, 잠기면 두 기능 모두 막힌다 (카드 20261011-0330).
            로그인은 막지 않는다(탈취된 세션이 비밀번호를 추측하는 것을 막는 용도). 남은 시간은 Retry-After 헤더(초)와 retryAfterSeconds.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RateLimitedProblem'
  /api/users/me:
    get:
      tags: [me]
      operationId: getMe
      summary: 현재 사용자 조회
      description: |
        프론트의 로그인 상태 확인과 worklog의 사본 즉시 조회(P0-11)가 함께 쓴다.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [me]
      operationId: updateMe
      summary: 공통 프로필·화면 설정 수정 (AUTH-04·05, UX-09, P1-01)
      description: |
        보낸 칸만 바꾼다(항목별 자동 저장, SCR-SET-01·02). 칸을 보내지 않으면 그대로 두고, version은 항상 보낸다.
        - version이 현재 값과 다르면 409(VERSION_CONFLICT)이며 아무것도 바꾸지 않는다.
          한 화면에서 여러 칸을 저장할 때 프론트는 저장 요청을 순서대로 보내고, 직전 응답의 version을 다음 요청에 쓴다.
        - 값이 실제로 바뀐 경우에만 version이 올라간다. Profile 칸이 바뀌었으면 사용자 변경 피드에 PROFILE_UPDATED(전체 Profile)를
          같은 트랜잭션으로 남긴다(keyboardShortcutsEnabled·테마만 바뀐 경우는 피드 없음). 바뀐 값이 없으면 200으로 현재 상태를 그대로 준다.
        - 문자열 칸(name·organization·position)은 앞뒤 공백을 지워 저장하고, 빈 문자열이나 null이면 값을 지운다(null 저장).
        - timezone·weekStart·workDays·keyboardShortcutsEnabled·themeAccent·themeGround는 지울 수 없다. null을 보내면 400(REQUIRED).
        - 테마(UX-07, P4-09): themeAccent는 #RRGGBB 아무 색(직접 고르기), themeGround는 4종만. 대소문자 모두 받고 대문자로 저장한다.
          틀리면 400 THEME_ACCENT_INVALID·THEME_GROUND_INVALID. 키 컬러 위 글자색(대비 4.5:1)은 화면이 고른다.
        - 이메일은 이 API로 바꾸지 않는다.
        - worklog 사본은 피드로 약 30초 안에 갱신된다. 화면이 즉시 반영을 원하면 저장 후 worklog의 POST /api/worklog/me/profile/refresh를 호출한다 (contracts/worklog.yaml).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        '200':
          description: 수정 성공 (또는 바뀐 값 없음). 새 version이 담긴 현재 사용자를 준다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OriginRejected'
        '409':
          $ref: '#/components/responses/VersionConflict'
  /api/users/me/email-verification:
    get:
      tags: [me]
      operationId: getEmailVerification
      summary: 이메일 인증 진행 상태 (SCR-AUTH-08 모달을 열 때)
      description: 남은 시간·재발송 가능 시각·남은 시도 횟수를 준다. 유효한 코드가 없으면 해당 칸은 null이다.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailVerificationStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [me]
      operationId: sendEmailVerificationCode
      summary: 인증번호 메일 발송·재발송 (AUTH-08, P1-12)
      description: |
        6자리 코드를 새로 만들어 SCR-MAIL-01 메일로 보낸다(제목에 코드 없음, D-41). 이전 코드는 무효가 된다.
        가입 직후에는 서버가 첫 코드를 자동으로 보낸다(이 API를 부르지 않아도 됨). 자동 발송도 발송 제한에 포함된다.
        발송 제한: 60초 간격, 24시간에 10통. 메일은 커밋 뒤 보내며(D-53), 발송 실패는 응답에 영향을 주지 않는다.
      security:
        - bearerAuth: []
      responses:
        '202':
          description: 새 코드 발급, 메일 발송 예약
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeIssued'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OriginRejected'
        '409':
          description: 이미 인증된 이메일 (code=EMAIL_ALREADY_VERIFIED)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/SendLimited'
  /api/users/me/email-verification/confirm:
    post:
      tags: [me]
      operationId: confirmEmailVerification
      summary: 인증 코드 확인
      description: |
        맞으면 이메일 인증을 완료하고 현재 사용자를 준다(emailVerified=true). 이미 인증된 사용자는 코드와 관계없이 200.
        이메일 인증은 Profile 칸이 아니라 피드에 남기지 않는다(version은 오른다).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  $ref: '#/components/schemas/VerificationCode'
      responses:
        '200':
          description: 인증 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/CodeRejected'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OriginRejected'
  /api/users/me/deletion:
    post:
      tags: [me]
      operationId: deleteMe
      summary: 회원 탈퇴 (AUTH-06, P4-05, SCR-SET-07 ③⑤)
      description: |
        비밀번호를 다시 입력받아 확인한 뒤 즉시 실제로 삭제한다 (D-49, D-174 ④). 유예 기간·복구는 없다.
        탈퇴 전 확인은 비밀번호 재확인만 한다.
        DELETE /api/users/me가 아니라 POST인 까닭: 비밀번호를 본문으로 받아야 하는데 DELETE 본문은 프록시·클라이언트가 버릴 수 있다.

        확인 순서: access 검증(401) → 시도 제한(429) → 비밀번호(400 PASSWORD_MISMATCH).

        성공하면 한 트랜잭션에서
        - users 행을 지운다. 로그인 수단·Refresh Token(모든 기기의 로그인 세션)·인증 코드는 FK로 함께 지워진다.
          이메일은 남기지 않으므로 같은 이메일로 바로 다시 가입할 수 있고, 새 계정은 새 ID다 (D-49).
        - 탈퇴 기록(user_id·시각만, /internal/deleted-users)을 남기고 사용자 변경 피드에 DELETED를 남긴다.
          그 사용자의 과거 CREATED·PROFILE_UPDATED 이벤트는 지운다.
        - 쿠키 2종을 지운다(Set-Cookie Max-Age=0, refresh_token은 Path=/api/auth로 지운다).

        다른 모듈의 파기 (D-28, D-45): worklog는 피드를 30초마다 받아 DELETED를 반영할 때 업무·일정·기록·일지를 지운다.
        - 파기 지연 상한(처리방침에 적는 값, WY-backend2 확인 2026-10-11): 정상 운영 시 탈퇴 후 1분 이내,
          놓친 쓰기를 지우는 재파기는 15분 뒤(20분 이내 완료). identity 또는 worklog가 멈춰 있었다면 복구 직후 첫 poll에서 파기한다.
        - identity는 탈퇴 직후부터 남은 Access Token(최대 10분) 요청을 401 USER_DELETED로 거부한다. worklog는 반영(1분 이내) 뒤부터
          401 USER_DELETED이고, 반영 전 요청으로 생긴 데이터는 재파기(20분 이내)로 지운다.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeletionRequest'
      responses:
        '204':
          description: 탈퇴 완료. 쿠키 2종을 지운다. 화면은 탈퇴 완료 안내로 이동한다.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearAuthCookies'
        '400':
          description: |
            - PASSWORD_MISMATCH: 비밀번호가 틀림. errors[]에 field=password, code=PASSWORD_MISMATCH 하나. 불일치 횟수가 1 오른다.
            - VALIDATION_FAILED: password 칸 없음(REQUIRED).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OriginRejected'
        '429':
          description: |
            비밀번호 재확인 불일치가 15분 안에 5회면 15분 동안 막는다 (code=PASSWORD_CHANGE_LOCKED, 비밀번호 변경과 같은 횟수를 함께 센다, 카드 20261011-0330).
            남은 시간은 Retry-After 헤더(초)와 retryAfterSeconds.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RateLimitedProblem'
  /.well-known/jwks.json:
    get:
      tags: [jwks]
      operationId: getJwks
      summary: JWT 서명 공개키 (내부 전용)
      description: |
        Gateway와 각 서비스가 jwk-set-uri로 가져간다. 키를 교체할 때는 신·구 공개키를 함께 게시한다(kid로 구분, NFR-03).
      responses:
        '200':
          description: JWK Set (RFC 7517)
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      required: [kty, kid, use, alg, n, e]
                      properties:
                        kty:
                          type: string
                          const: RSA
                        kid:
                          type: string
                        use:
                          type: string
                          const: sig
                        alg:
                          type: string
                          const: RS256
                        n:
                          type: string
                        e:
                          type: string
  /internal/oauth/token:
    post:
      tags: [internal]
      operationId: issueServiceToken
      summary: 서비스 토큰 발급 (OAuth2 client credentials)
      description: |
        client_id·secret은 HTTP Basic으로 보낸다. 비밀값은 identity에 해시로 저장한다(ServiceClient).
        호출 측은 만료 직전까지 토큰을 캐시한다.
      security:
        - clientBasic: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type:
                  type: string
                  const: client_credentials
                scope:
                  type: string
                  description: 공백 구분. 생략하면 클라이언트에 허용된 scope 전체.
                  example: user-events:read users:read
      responses:
        '200':
          description: 발급 성공 (RFC 6749 5.1 형식이라 snake_case)
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in]
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    const: Bearer
                  expires_in:
                    type: integer
                    example: 300
                  scope:
                    type: string
        '400':
          description: 지원하지 않는 grant_type 또는 허용되지 않은 scope (RFC 6749 5.2 오류 형식, error=unsupported_grant_type·invalid_scope)
        '401':
          description: 클라이언트 인증 실패 (RFC 6749 5.2, error=invalid_client)
  /internal/user-events:
    get:
      tags: [internal]
      operationId: listUserEvents
      summary: 사용자 변경 피드
      description: |
        seq 오름차순. 피드 기록은 직렬화되어 있어 after 이후 이벤트가 나중에 끼어드는 일이 없다 (5.4).
        seq는 단조 증가하지만 연속이 아닐 수 있다. 탈퇴 시 그 사용자의 과거 CREATED·PROFILE_UPDATED 이벤트를 지우고 DELETED만 남기기 때문이다.
        피드는 30일 보관한다. 소비자는 user_id 기준으로 멱등하게 반영하고 마지막 seq를 커서로 저장한다.
      security:
        - serviceToken: [user-events:read]
      parameters:
        - name: after
          in: query
          required: true
          description: 마지막으로 처리한 seq. 처음이면 /internal/users로 전체 동기화한 뒤 asOfSeq를 쓴다.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                required: [items, hasMore]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserEvent'
                  hasMore:
                    type: boolean
        '400':
          $ref: '#/components/responses/InvalidInternalQuery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ScopeRequired'
        '410':
          description: after가 보관 기간 밖 (code=FEED_CURSOR_EXPIRED). 소비자는 전체 재동기화한다.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /internal/users:
    get:
      tags: [internal]
      operationId: listUsers
      summary: 전체 사용자 목록 (재동기화용)
      description: |
        신규 모듈 합류나 장기 장애 복구 때 사본을 다시 채운다. 탈퇴 사용자는 포함하지 않는다.
        asOfSeq는 첫 페이지를 만든 시점의 피드 최신 seq다. 모든 페이지를 받은 뒤 커서를 asOfSeq로 두고 피드를 이어서 읽는다.
        (asOfSeq 이후의 변경은 피드로 다시 오므로 페이지 사이에 바뀐 사용자도 결국 최신이 된다.)
      security:
        - serviceToken: [users:read]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                required: [items, asOfSeq]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [userId, profile]
                      properties:
                        userId:
                          type: string
                          format: uuid
                        profile:
                          $ref: '#/components/schemas/Profile'
                  nextCursor:
                    type: [string, 'null']
                  asOfSeq:
                    type: integer
                    format: int64
        '400':
          $ref: '#/components/responses/InvalidInternalQuery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ScopeRequired'
  /internal/deleted-users:
    get:
      tags: [internal]
      operationId: listDeletedUsers
      summary: 탈퇴 기록 목록
      description: 재동기화와 백업 복원 후 탈퇴 재적용(D-34)에 쓴다. 탈퇴 기록은 식별 정보 없이 user_id와 시각만 가진다.
      security:
        - serviceToken: [users:read]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [userId, deletedAt]
                      properties:
                        userId:
                          type: string
                          format: uuid
                        deletedAt:
                          type: string
                          format: date-time
                  nextCursor:
                    type: [string, 'null']
        '400':
          $ref: '#/components/responses/InvalidInternalQuery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ScopeRequired'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 브라우저 요청은 Gateway가 access_token 쿠키를 옮겨 넣는다.
    clientBasic:
      type: http
      scheme: basic
      description: client_id:secret
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: /internal/oauth/token으로 받은 서비스 토큰 (aud=erp-internal, scope 필수)
  headers:
    SetAuthCookies:
      description: access_token, refresh_token 쿠키 (속성은 info.description 참고)
      schema:
        type: string
    ClearAuthCookies:
      description: access_token(Path=/api), refresh_token(Path=/api/auth)을 Max-Age=0으로 지움
      schema:
        type: string
  parameters:
    Cursor:
      name: cursor
      in: query
      description: 이전 응답의 nextCursor. 처음이면 생략.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
  responses:
    ValidationFailed:
      description: |
        입력 오류 (code=VALIDATION_FAILED). 칸별 오류는 errors[]에 field·code로 준다.
        errors[].code 목록:
        - EMAIL_INVALID: 이메일 형식이 아님
        - PASSWORD_LENGTH: 8자 미만 또는 64자 초과 (글자 수 기준)
        - PASSWORD_TOO_LONG_BYTES: UTF-8 72바이트 초과 (D-38, 화면은 한글 안내 문구를 따로 표시)
        - PASSWORD_LETTER_DIGIT_REQUIRED: 영문과 숫자를 모두 포함하지 않음
        - PASSWORD_SAME_AS_EMAIL: 이메일과 같은 문자열 (대소문자 무시)
        - PASSWORD_SAME_AS_CURRENT: 새 비밀번호가 현재 비밀번호와 같음 (비밀번호 변경만, P4-08)
        - AGREEMENT_REQUIRED: 필수 동의 항목 미동의
        - REQUIRED: 필수 값 없음 (PATCH에서 지울 수 없는 칸에 null을 보낸 경우 포함)
        - TOO_LONG: 이름·소속·직책이 공백 제거 후 100자 초과
        - TIMEZONE_INVALID: IANA 시간대 이름이 아님 (예: Asia/Seoul. +09:00 같은 오프셋은 받지 않는다)
        - WORK_DAYS_INVALID: 업무 요일이 1~127 밖 (요일을 하나도 고르지 않은 0 포함)
        - CODE_FORMAT: 인증·재설정 코드가 6자리 숫자가 아님
        비밀번호 규칙을 여러 개 어기면 errors[]에 모두 넣는다.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: |
        토큰 없음·만료·서명 오류·aud 불일치 (code=UNAUTHENTICATED), 또는 탈퇴한 사용자 (code=USER_DELETED).
        프론트는 UNAUTHENTICATED일 때 refresh 1회 후 재시도한다 (P0-07).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvalidInternalQuery:
      description: |
        cursor 형식이 틀림 (code=INVALID_CURSOR, 이전 응답의 nextCursor를 그대로 보내야 한다),
        after·limit 누락·범위 밖 (code=BAD_REQUEST), 또는 after·limit이 숫자가 아님
        (code=VALIDATION_FAILED, errors[].code=INVALID_FORMAT — 모든 서비스 공통 처리).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ScopeRequired:
      description: 서비스 토큰에 필요한 scope가 없음 (code=INSUFFICIENT_SCOPE)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    OriginRejected:
      description: 쓰기 요청의 Origin이 허용 목록에 없거나 없음 (code=ORIGIN_REJECTED). Gateway가 응답한다 (NFR-02).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    VersionConflict:
      description: |
        보낸 version이 현재 값과 다름 (code=VERSION_CONFLICT, D-30). 다른 탭·기기에서 먼저 수정된 경우다.
        화면은 충돌 띠와 [새로 불러오기]를 보여 주고 덮어쓰지 않는다 (화면정의서 2.5).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    CodeRejected:
      description: |
        인증·재설정 코드 오류. 코드는 6자리 숫자, 10분 유효, 5회까지 입력할 수 있다 (AUTH-08·03).
        - CODE_MISMATCH: 코드가 틀림. attemptsRemaining에 남은 시도 횟수 (화면: "코드가 맞지 않아요(남은 시도 n회)")
        - CODE_EXPIRED: 유효한 코드가 없음 — 10분 지남, 5회 모두 틀림, 새 코드 발급으로 무효, 이미 사용, 발급한 적 없음.
          화면은 입력을 잠그고 "새 코드 받기"를 보여 준다.
        - VALIDATION_FAILED: 코드 형식이 6자리 숫자가 아님(errors[].code=CODE_FORMAT, 시도 횟수에 넣지 않음)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/CodeRejectedProblem'
    SendLimited:
      description: |
        코드 메일 발송 제한. 계정 단위: RESEND_TOO_SOON(마지막 발송 후 60초 안) 또는 DAILY_SEND_LIMIT(보낸 시각부터 24시간에 10통).
        IP 단위: TOO_MANY_REQUESTS(같은 IP에서 1시간에 10회, 인증·재설정 요청 합산. 접속자 IP를 모르면 적용하지 않는다, D-61).
        남은 시간은 Retry-After(초)와 retryAfterSeconds로 준다.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/RateLimitedProblem'
  schemas:
    SignupRequest:
      type: object
      required: [email, password, agreeTerms, agreePrivacy]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          description: 8~64자, UTF-8 72바이트 이하, 영문·숫자 포함, 이메일과 다른 문자열 (D-38)
        agreeTerms:
          type: boolean
          description: 이용약관 동의 (true여야 함)
        agreePrivacy:
          type: boolean
          description: 개인정보 처리방침 동의 (true여야 함). 국외 보관 안내는 별도 동의가 아니다 (D-33).
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
    Me:
      type: object
      description: 현재 사용자. Profile의 칸을 같은 이름·타입으로 모두 포함한다.
      required: [id, email, emailVerified, timezone, weekStart, workDays, themeAccent, themeGround, keyboardShortcutsEnabled, version]
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7, JWT sub와 같음
        email:
          type: string
        emailVerified:
          type: boolean
          description: 이메일 인증 완료 여부 (AUTH-08, 미인증 배너 표시용)
        name:
          type: [string, 'null']
        organization:
          type: [string, 'null']
        position:
          type: [string, 'null']
          description: 표시용 직책 (권한용 역할과 별개)
        timezone:
          type: string
          example: Asia/Seoul
        weekStart:
          $ref: '#/components/schemas/WeekStart'
        workDays:
          $ref: '#/components/schemas/WorkDays'
        themeAccent:
          type: string
          pattern: '^#[0-9A-F]{6}$'
          example: '#4B3FD6'
        themeGround:
          type: string
          pattern: '^#[0-9A-F]{6}$'
          example: '#F2F4FA'
        keyboardShortcutsEnabled:
          type: boolean
          default: true
          description: |
            키보드 단축키 사용 (UX-09, SCR-SET-02 ⑥, 기본 켬). 끄면 수식키 없는 한 글자 단축키가 모두 꺼진다.
            테마처럼 앱 전체 화면 설정이라 identity에 두며, 모듈에는 전달하지 않는다(Profile·피드에 없음).
        version:
          type: integer
          format: int64
          description: 낙관적 잠금 버전. PATCH /api/users/me에 그대로 보낸다.
    ProfileUpdateRequest:
      type: object
      description: |
        보낸 칸만 수정한다. 칸 없음 = 그대로, null = 지움(이름·소속·직책만). 모르는 칸은 무시한다.
      required: [version]
      properties:
        version:
          type: integer
          format: int64
          description: 마지막으로 받은 Me.version
        name:
          type: [string, 'null']
          maxLength: 100
        organization:
          type: [string, 'null']
          maxLength: 100
        position:
          type: [string, 'null']
          maxLength: 100
          description: 표시용 직책 (권한용 역할과 별개)
        timezone:
          type: string
          description: IANA 시간대 이름. 바꿔도 기존 기록 날짜는 그대로다 (D-40).
          example: Asia/Seoul
        weekStart:
          $ref: '#/components/schemas/WeekStart'
        workDays:
          type: integer
          minimum: 1
          maximum: 127
          description: 비트마스크 월=1 … 일=64. 최소 하루는 골라야 한다.
        keyboardShortcutsEnabled:
          type: boolean
          description: 키보드 단축키 사용 (UX-09). 피드에는 남기지 않는다.
        themeAccent:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          example: '#4B3FD6'
          description: 키 컬러 (UX-07). 프리셋이 아닌 색도 받는다. 대문자로 저장한다. 틀리면 THEME_ACCENT_INVALID.
        themeGround:
          type: string
          enum: ['#F2F4FA', '#F6F2EA', '#EEF4EF', '#FFFFFF']
          description: 배경 (UX-07) 쿨 그레이·웜 베이지·세이지·화이트. 이 4개만 받는다(대소문자 무관). 틀리면 THEME_GROUND_INVALID.
    VerificationCode:
      type: string
      pattern: '^[0-9]{6}$'
      description: 메일로 받은 6자리 숫자
    CodeIssued:
      type: object
      description: 코드를 새로 발급했을 때 화면의 카운트다운용 시각 (UTC)
      required: [expiresAt, resendAvailableAt]
      properties:
        expiresAt:
          type: string
          format: date-time
          description: 코드 만료 시각 (발급 + 10분)
        resendAvailableAt:
          type: string
          format: date-time
          description: 다시 받기를 누를 수 있는 시각 (발급 + 60초)
    EmailVerificationStatus:
      type: object
      required: [verified]
      properties:
        verified:
          type: boolean
        expiresAt:
          type: [string, 'null']
          format: date-time
          description: 유효한 코드의 만료 시각. 유효한 코드가 없으면 null
        attemptsRemaining:
          type: [integer, 'null']
          description: 유효한 코드의 남은 시도 횟수. 유효한 코드가 없으면 null
        resendAvailableAt:
          type: [string, 'null']
          format: date-time
          description: 다시 받을 수 있는 시각. 지금 받을 수 있으면 null. 하루 한도에 닿았으면 한도가 풀리는 시각
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          description: 가입과 같이 앞뒤 공백 제거·소문자로 비교한다
    CodeCheckRequest:
      type: object
      required: [email, code]
      properties:
        email:
          type: string
        code:
          $ref: '#/components/schemas/VerificationCode'
    PasswordResetConfirmRequest:
      type: object
      required: [email, code, newPassword]
      properties:
        email:
          type: string
        code:
          $ref: '#/components/schemas/VerificationCode'
        newPassword:
          type: string
          description: 8~64자, UTF-8 72바이트 이하, 영문·숫자 포함, 이메일과 다른 문자열 (D-38). errors[].field는 newPassword
    AccountDeletionRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          description: 현재 비밀번호. errors[].field는 password
    PasswordChangeRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          description: 8~64자, UTF-8 72바이트 이하, 영문·숫자 포함, 이메일과 다른 문자열 (D-38), 현재 비밀번호와 다른 문자열. errors[].field는 newPassword
    PasswordChanged:
      type: object
      required: [currentSessionKept]
      properties:
        currentSessionKept:
          type: boolean
          description: |
            true: 현재 기기는 로그인 유지, 다른 기기의 로그인 세션은 폐기 (화면: 토스트 "비밀번호를 바꿨어요. 다른 기기에서는 로그아웃돼요").
            false: 현재 기기를 가려낼 수 없어 모든 로그인 세션을 폐기하고 쿠키를 지움 (화면: 로그인 화면으로).
    CodeRejectedProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            attemptsRemaining:
              type: integer
              description: CODE_MISMATCH일 때만. 남은 시도 횟수 (0이면 다음부터 CODE_EXPIRED)
    Profile:
      type: object
      description: |
        모듈에 전달하는 공통 프로필 스냅샷. 바뀐 칸만이 아니라 항상 전체를 보낸다. email·테마는 넣지 않는다.
        version은 Me.version과 같은 값(사용자 행의 낙관적 잠금 버전)이다. 소비자는 사본의 version보다 큰 값만 반영한다
        (피드와 즉시 재조회 중 어느 쪽이 먼저 와도 옛 값으로 덮어쓰지 않게). 테마·인증 상태만 바뀌어도 version은 오를 수 있다.
        P1-01 이전에 기록된 피드 이벤트에는 version이 없다. 소비자는 없으면 0으로 본다.
      required: [timezone, weekStart, workDays, version]
      properties:
        version:
          type: integer
          format: int64
        name:
          type: [string, 'null']
        organization:
          type: [string, 'null']
        position:
          type: [string, 'null']
        timezone:
          type: string
        weekStart:
          $ref: '#/components/schemas/WeekStart'
        workDays:
          $ref: '#/components/schemas/WorkDays'
    WeekStart:
      type: string
      enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]
      default: MONDAY
    WorkDays:
      type: integer
      minimum: 0
      maximum: 127
      default: 31
      description: 비트마스크 월=1 … 일=64, 기본 31(월~금)
    UserEvent:
      type: object
      required: [seq, type, userId, occurredAt]
      properties:
        seq:
          type: integer
          format: int64
        type:
          type: string
          enum: [CREATED, PROFILE_UPDATED, DELETED]
        userId:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        profile:
          description: CREATED·PROFILE_UPDATED에만 있음. DELETED에는 없음.
          oneOf:
            - $ref: '#/components/schemas/Profile'
            - type: 'null'
    Problem:
      type: object
      description: RFC 9457 Problem Details + 확장 필드 (P0-10 공통 모듈 형식, contracts/worklog.yaml과 같음)
      required: [type, title, status, code, traceId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: 기계 판독용 오류 코드
        errors:
          type: array
          items:
            type: object
            required: [field, code]
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
        traceId:
          type: string
    RateLimitedProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [retryAfterSeconds]
          properties:
            retryAfterSeconds:
              type: integer
              description: 다시 시도할 수 있을 때까지 남은 초. 잠금 안내 문구에 쓴다.
