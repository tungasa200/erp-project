openapi: 3.1.0
info:
  title: worklog-service API
  version: 0.6.0
  description: |
    구현 전 합의용 계약. P0 범위(GET /api/worklog/me)는 구현 완료, P1-01~03 범위는 2026-10-05 확정(구현 전).
    P3 업무일지(logs)·기간 기록 내보내기(records/export)는 2026-10-08 확정(사용자 카드 20261008-1130·1131 추천안). 파일 생성 라이브러리는 P3-01 뒤 정한다.
    P1-05·06 일정 범위(schedules)는 2026-10-06 확정.
    P2-04 자주 하는 업무 제안(GET /api/worklog/tasks/frequent)은 2026-10-07 확정.
    P2-01 업무 기록(records)은 2026-10-07 확정.
    P2-03 확인 대기 목록·모두 했어요(records/pending)는 2026-10-07 확정.
    P2-06 타이머(timer)·P2-07 집계·빈 시간(records/time-summary, records/gaps)과 기록 생성·수정의 "진행 중" 규칙 변경은 2026-10-07 확정(D-101·D-102).
    업무 시간대 설정(TIME-11)은 P1-01의 PATCH /me/settings(workHoursStart·End)로 이미 있다.
    P4 통계(stats, P4-02), 알림 센터·웹 푸시(notifications·push, P4-01), 설정 dailyCloseNotifyEnabled, 탈퇴 파기 지연 상한(P4-05)은 2026-10-10 확정(사용자 카드 20261011-0400·0401, D-176).

    탈퇴 파기 지연 상한 (P4-05, AUTH-06·NFR-10, D-45 — identity.yaml 탈퇴 API·처리방침과 같은 수치, 카드 0330):
    - worklog는 identity 사용자 변경 피드를 30초 간격(앞 읽기가 끝난 뒤부터)으로 읽고, 한 번에 밀린 페이지를 모두 따라잡는다.
      DELETED 이벤트를 받으면 그 자리에서 사용자 데이터를 실제로 지우고 탈퇴 사용자 목록에 올린다 → 보통 탈퇴 후 1분 이내 파기.
    - 반영 뒤에는 남은 Access Token(최대 10분)의 요청을 401 USER_DELETED로 거부한다. 반영 전(최대 약 1분)의 요청으로 생긴 데이터는
      탈퇴 15분 뒤 재파기(5분 간격 작업)로 지운다 → 늦어도 탈퇴 후 20분 이내 완료.
    - identity나 worklog가 멈춰 있었다면 복구(재기동) 뒤 첫 읽기(30초 안)에서 파기한다.
    - 알림·푸시 구독(P4-01)도 파기 대상이다.
    구현 후에는 springdoc 출력(contracts/generated/worklog.json)이 기준이다 (D-47).
    규약은 요구사항정의서 5.5를 따른다: /api/worklog/ 접두사, 버전 없음,
    시각은 UTC ISO-8601, 날짜는 YYYY-MM-DD, 시간대는 IANA 이름, camelCase,
    오류는 RFC 9457 Problem Details + code·errors[]·traceId.

    인증: 브라우저는 access_token 쿠키(Path=/api)만 보낸다. Gateway가 쿠키를
    Authorization: Bearer로 옮겨 전달하고, worklog-service가 JWT를 다시 검증해
    sub(사용자 ID)로 사용자를 식별한다 (D-19). 검증: iss=erp-identity, aud=erp-api, exp.
    서비스 토큰(aud=erp-internal)은 사용자 API에서 거부한다.

    P1 공통 규칙:
    - 소유자: 모든 리소스는 요청한 사용자 것만 보인다. 다른 사용자의 ID는 없는 ID와 같게 404(NOT_FOUND)다.
    - 수정(PATCH): 보낸 칸만 바꾼다. nullable 칸은 null을 보내면 비운다. 본문의 version이 현재 값과
      다르면 409(VERSION_CONFLICT)이며 아무것도 바꾸지 않는다. 성공 응답의 version을 다음 PATCH에 쓴다.
      자동 저장은 같은 리소스의 PATCH를 앞 요청의 응답을 받은 뒤 보낸다(동시에 보내면 뒤 요청이 409).
    - 트랜잭션: 요청 하나가 한 트랜잭션이다 (D-53).
security:
  - accessTokenCookie: []
servers:
  - url: /
tags:
  - name: me
    description: 현재 사용자 (worklog 사본 프로필과 worklog 전용 설정) — P0, P1-01
  - name: projects
    description: 프로젝트 — P1-02 (TASK-04, SCR-SET-08)
  - name: tags
    description: 태그 — P1-02 (TASK-04, SCR-SET-08)
  - name: tasks
    description: 업무 — P1-03 (TASK-01·02·03·05, SCR-TASK-01·02), 목록 필터는 P1-04 (TASK-06)
  - name: schedules
    description: 일정 — P1-05 일정 CRUD·종일 (SCH-02), P1-06 반복 (SCH-03, D-24), SCR-CAL-07·08
  - name: records
    description: 업무 기록 — P2-01 (REC-01, SCR-REC-01), 확인 대기 생성·모두 했어요는 P2-03 (REC-03, SCR-HOME-02)
  - name: timer
    description: '타이머 — P2-06 (TIME-03·10, SCR-COM-06). 실행 중 타이머는 endAt 없는 업무 기록이다'
  - name: stats
    description: 통계 — P4-02 (STAT-01·UX-05, SCR-STAT-01)
  - name: notifications
    description: 알림 센터·웹 푸시 — P4-01 (NOTI-01·LOG-16, SCR-COM-05·SET-05)
  - name: logs
    description: |
      업무일지 — P3. 도메인·확정·이력 P3-02 (LOG-05·06, SCR-LOG-04), 일간 생성기 P3-03 (LOG-01~03·15, SCR-LOG-02),
      하루 마감·이월 P3-05 (LOG-13·14, SCR-LOG-03), 주간·월간 P3-07 (LOG-07·08·16), 목록 P3-08 (LOG-09, SCR-LOG-01),
      홈 미리보기·이번 주 현황 P3-04 (LOG-12, SCR-HOME-01 ⑤⑦ — 이 API를 그대로 씀), 내보내기 P3-10 (EXP-01~04, AUTH-08, SCR-LOG-05·06).

      공통 규칙:
      - 일지 하나 = (사용자, 종류, 기간 시작일). 일간은 그날, 주간은 프로필 주 시작 요일(week_start)의 날, 월간은 그달 1일.
        기간 시작일이 맞지 않으면 400(errors[].field=periodStart, code=INVALID_FORMAT).
      - 날짜는 기록의 workDate(저장 시점 시간대, D-40)와 사용자의 현재 시간대 기준 오늘로 판단한다.
      - 근무일(D-37): 업무 요일(work_days) 중 공휴일(shared/holidays/KR.json, D-74)이 아닌 날.
      - 초안의 실적은 "자동" 상태로 시작한다: 저장하지 않고 읽을 때마다 원본(확정 기록·완료 업무)에서 만든다(LOG-12 실시간 미리보기).
        사용자가 실적을 한 번 고치면 그때부터 저장된 값을 쓰고, "원본에서 다시 채우기"로 자동 상태로 되돌린다.
        진행 현황 수치·소요시간 표는 초안에서는 늘 원본으로 계산한다.
      - 확정하면 머리(작성자)·실적·수치·계획·이슈·소요시간 전체를 스냅샷으로 저장하고, 이후 원본이 바뀌어도 바뀌지 않는다(LOG-05).
      - 확정한 일지는 PATCH·다시 채우기가 409(code=LOG_CONFIRMED)다. 확정 해제 후 고친다(LOG-06).
paths:
  /api/worklog/me:
    get:
      tags: [me]
      operationId: getMe
      summary: 현재 사용자의 worklog 프로필 조회
      description: |
        worklog에 사용자 사본이 없으면(가입 직후) 이 요청 안에서 identity를 조회해 사본을 만든 뒤 응답한다 (P0-11).
        worklog 전용 설정이 아직 없으면 기본값(version=0)으로 응답한다.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorklogMe'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ProfileUnavailable'
  /api/worklog/me/profile/refresh:
    post:
      tags: [me]
      operationId: refreshMyProfile
      summary: 공통 프로필 사본 즉시 갱신 (P1-01)
      description: |
        identity에서 프로필(이름·소속·직책·시간대·주 시작 요일·업무 요일)을 저장한 직후 프론트가 호출한다 (요구사항 5.4 "프로필 재조회").
        worklog가 사용자 토큰으로 identity GET /api/users/me를 조회해 사본을 갱신하고 WorklogMe를 돌려준다.
        사본은 identity User의 version(프로필과 같은 행의 낙관적 잠금 값)이 사본에 저장된 version보다 클 때만 바꾼다.
        피드 이벤트도 payload의 version으로 같은 비교를 하므로, 나중에 도착하는 오래된 피드 이벤트가 새 값을 되돌리지 않는다.
        (전제: identity Profile 스키마에 version 추가 — 피드 CREATED·PROFILE_UPDATED payload, /internal/users, /api/users/me)
        본문 없음. 쓰기 요청이므로 Gateway Origin 검사 대상이다.
      responses:
        '200':
          description: 갱신 후 현재 값
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorklogMe'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ProfileUnavailable'
  /api/worklog/me/settings:
    patch:
      tags: [me]
      operationId: updateMySettings
      summary: worklog 전용 설정 수정 (P1-01, 항목별 자동 저장)
      description: |
        SCR-SET-02의 ④ 업무 시간대 ⑤ 하루 마감 시각과 SCR-SET-03의 시간 기록 사용 여부, SCR-SET-05 ① 하루 마감 알림 켜기(P4-01).
        설정 행이 아직 없으면 version=0으로 보내고, 이 요청이 기본값 위에 보낸 칸을 반영해 행을 만든다.
        dailyCloseTime·dailyCloseNotifyEnabled가 바뀌면 다음 알림 시각(next_notify_at)을 다시 계산한다 (5.6). 프로필 시간대·업무 요일이 바뀌어도
        (피드로 사본이 바뀔 때) 다시 계산한다.
        하루 마감 알림 발송(P4-01): 1분마다(ShedLock) next_notify_at이 지난 사용자에게 보낸다.
        - 근무일(D-37)이 아닌 날은 보내지 않는다. next_notify_at은 다음 근무일의 dailyCloseTime(사용자 시간대)이다.
        - 그날 일간 일지가 이미 확정(CONFIRMED)이면 보내지 않는다(이미 마감함).
        - 서버가 멈춰 1시간 넘게 지난 알림은 보내지 않고 다음 시각만 다시 계산한다.
        - 보내기 = 알림 센터 항목(DAILY_CLOSE, 확인 대기 수 포함) + 그 사용자의 모든 푸시 구독에 웹 푸시. 그날이 주(월)의 마지막 근무일이면
          LOG_SUGGESTION(WEEKLY → MONTHLY)도 같은 때 만든다(푸시는 하루 마감 한 통만).
        - 푸시 내용: 제목 "하루 마감 시간이에요", 본문 확인 대기 n건 안내(0이면 생략), 누르면 앱 화면 /logs/daily/{date}?close=1(마감 창이 열림, 알림 읽음 처리, pm 결정 2026-10-10). TTL 1시간.
          기록·업무 제목 같은 내용은 넣지 않는다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorklogSettingsPatch'
      responses:
        '200':
          description: 수정 후 설정 전체
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorklogSettings'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/VersionConflict'

  /api/worklog/projects:
    get:
      tags: [projects]
      operationId: listProjects
      summary: 프로젝트 목록
      description: |
        페이지 없이 전체를 돌려준다 (사용자별 개수가 작고 사이드바·필터·설정 화면이 전체를 쓴다). 만든 순서.
      parameters:
        - name: includeArchived
          in: query
          description: true면 보관한 프로젝트도 포함
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [projects]
      operationId: createProject
      summary: 프로젝트 추가
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/DuplicateName'
  /api/worklog/projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [projects]
      operationId: getProject
      summary: 프로젝트 조회
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [projects]
      operationId: updateProject
      summary: 프로젝트 수정·보관·보관 해제
      description: |
        삭제 API는 두지 않는다. 화면(SCR-SET-08)은 보관만 있고, 업무가 프로젝트를 계속 가리키게 하기 위함이다.
        보관한 프로젝트의 업무는 업무 목록 기본 조회에서 빠진다(목록의 projectId 필터로는 조회 가능).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectPatch'
      responses:
        '200':
          description: 수정 후 전체
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: version 불일치(code=VERSION_CONFLICT) 또는 같은 이름의 프로젝트가 있음(code=DUPLICATE_NAME)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/worklog/tags:
    get:
      tags: [tags]
      operationId: listTags
      summary: 태그 목록 (사용 수 포함)
      description: 페이지 없이 전체를 돌려준다. 이름순.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tag'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [tags]
      operationId: createTag
      summary: 태그 추가 (같은 이름이 있으면 그 태그를 돌려줌)
      description: |
        빠른 입력의 #태그처럼 "없으면 만들고 있으면 쓴다"를 한 번에 하기 위해, 같은 이름(대소문자 무시)이 이미 있으면
        새로 만들지 않고 200으로 기존 태그를 돌려준다. 새로 만들면 201.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagCreate'
      responses:
        '200':
          description: 같은 이름의 기존 태그
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '201':
          description: 생성됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/worklog/tags/{tagId}:
    parameters:
      - $ref: '#/components/parameters/TagId'
    patch:
      tags: [tags]
      operationId: updateTag
      summary: 태그 이름 변경
      description: 다른 태그와 이름이 같아지면 409(DUPLICATE_NAME). 합치기는 하지 않는다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagPatch'
      responses:
        '200':
          description: 수정 후 전체
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: version 불일치(code=VERSION_CONFLICT) 또는 같은 이름의 태그가 있음(code=DUPLICATE_NAME)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      tags: [tags]
      operationId: deleteTag
      summary: 태그 삭제
      description: 태그를 실제로 지우고 모든 업무에서 뗀다 (보관한 업무 포함). 되돌릴 수 없다.
      responses:
        '204':
          description: 삭제됨
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/worklog/tasks:
    get:
      tags: [tasks]
      operationId: listTasks
      summary: 업무 목록 (cursor, 필터·검색)
      description: |
        기본 조회는 보관(소프트 삭제)하지 않은 업무 중 보관한 프로젝트에 속하지 않은 것이다.
        projectId로 거르면 그 프로젝트가 보관 상태여도 업무를 돌려준다.
        정렬: sort=due는 마감일 오름차순(마감일 없음은 뒤) → 생성순, sort=created는 생성 역순. 같은 조건에서 id로 순서를 고정한다.
        필터를 바꾸면 cursor 없이 처음부터 조회한다(다른 조건의 cursor는 400 INVALID_CURSOR일 수 있다).
      parameters:
        - name: cursor
          in: query
          description: 이전 응답의 nextCursor. 처음이면 생략.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: status
          in: query
          description: 여러 개면 OR (?status=TODO&status=IN_PROGRESS)
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/TaskStatus'
        - name: projectId
          in: query
          description: 여러 개면 OR
          explode: true
          schema:
            type: array
            items:
              type: string
              format: uuid
        - name: tagId
          in: query
          description: 여러 개면 OR (태그 중 하나라도 붙은 업무)
          explode: true
          schema:
            type: array
            items:
              type: string
              format: uuid
        - name: dueFrom
          in: query
          description: 마감일 >= dueFrom
          schema:
            type: string
            format: date
        - name: dueTo
          in: query
          description: 마감일 <= dueTo
          schema:
            type: string
            format: date
        - name: completedSince
          in: query
          description: |
            완료 업무는 완료 시각이 이 시각 이후인 것만 (완료가 아닌 업무에는 영향 없음).
            "완료 업무 접기(최근 7일)"에 쓴다.
          schema:
            type: string
            format: date-time
        - name: q
          in: query
          description: 제목 부분 일치 검색 (대소문자 무시)
          schema:
            type: string
            maxLength: 100
        - name: deleted
          in: query
          description: true면 보관(소프트 삭제)한 업무만 돌려준다 (보관함, SCR-TASK-04)
          schema:
            type: boolean
            default: false
        - name: scheduled
          in: query
          description: |
            false면 일정이 연결되지 않은 업무만(캘린더 업무 패널, SCH-07), true면 연결된 업무만. 생략하면 거르지 않는다.
            연결은 schedule.task_id 기준이며 반복 일정은 시리즈 하나로 센다. (2026-10-06 추가)
          schema:
            type: boolean
        - name: sort
          in: query
          schema:
            type: string
            enum: [due, created]
            default: due
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
                  nextCursor:
                    type: [string, 'null']
                    description: 다음 페이지가 없으면 null
        '400':
          description: 값 형식 오류(code=VALIDATION_FAILED) 또는 cursor 형식이 틀림(code=INVALID_CURSOR)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [tasks]
      operationId: createTask
      summary: 업무 추가
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/worklog/tasks/frequent:
    get:
      tags: [tasks]
      operationId: listFrequentTasks
      summary: 자주 하는 업무 제안 (같은 요일·시간대 상위 3개)
      description: |
        빠른 입력에 포커스가 가면(SCR-COM-02 ④) 부른다. 빈도 집계이며 AI를 쓰지 않는다 (REC-05).
        집계:
        - 사건: 업무를 만든 시각(createdAt). P2-01 업무 기록이 생기면 확정(CONFIRMED) 기록도 사건에 더한다
          (기록 시각은 startAt, 없으면 회차 시작 시각, 없으면 기록을 만든 시각). 응답 모양은 그대로다.
        - 기간: at 이전 8주(56일).
        - 시간대 구간: 사용자의 현재 시간대(프로필) 기준 하루 4구간 — 새벽 00:00–06:00, 오전 06:00–12:00,
          오후 12:00–18:00, 저녁 18:00–24:00(시작 포함, 끝 제외). at과 같은 요일·같은 구간의 사건을 센다.
        - 같은 업무: 제목의 앞뒤 공백을 빼고 연속 공백을 하나로 줄인 뒤 대소문자를 무시해 같으면 같은 업무다
          (매주 새로 만드는 "주간 회의 준비"를 하나로 센다). 보관(소프트 삭제)한 업무는 세지 않는다. 완료한 업무는 센다.
        - 순위: 사건 수 내림차순 → 마지막 사건이 최근인 순. 사건이 2번 이상인 것만 제안한다.
        - 채우기: 같은 요일에서 3개가 안 되면 요일과 관계없이 같은 구간에서 모자란 만큼 채운다(앞 것과 겹치지 않게).
        - 대표 값: 묶음에서 가장 최근에 만든 업무의 제목·프로젝트·태그를 준다. 그 프로젝트가 보관 상태면 projectId는 null.
        결과가 없으면 items는 빈 배열이다(200). 프론트는 같은 15분 칸 안에서는 응답을 다시 쓴다.
      parameters:
        - name: at
          in: query
          description: 기준 시각(UTC ISO-8601). 생략하면 지금. 빈 시간 메우기(SCR-HOME-03)처럼 지난 구간의 후보를 볼 때 쓴다.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: 제안 목록 (0~3개, 순위 순)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrequentTaskList'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ProfileUnavailable'
  /api/worklog/tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [tasks]
      operationId: getTask
      summary: 업무 조회 (보관한 업무 포함)
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [tasks]
      operationId: updateTask
      summary: 업무 수정 (항목별 자동 저장)
      description: |
        상태를 DONE으로 바꾸면 completedAt을 지금 시각으로 기록하고, DONE에서 다른 상태로 바꾸면 completedAt을 비운다.
        상태 전이에 제한은 없다(네 상태 사이 어느 쪽으로든). 진행률은 상태에 따라 자동으로 바꾸지 않는다.
        tagIds는 보낸 목록으로 통째로 바꾼다.
        보관한 업무는 수정할 수 없다(409 TASK_DELETED, 먼저 복원).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskPatch'
      responses:
        '200':
          description: 수정 후 전체
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: version 불일치(code=VERSION_CONFLICT) 또는 보관한 업무(code=TASK_DELETED)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      tags: [tasks]
      operationId: deleteTask
      summary: 업무 보관 (소프트 삭제)
      description: |
        deletedAt을 기록한다. 이미 보관한 업무면 그대로 204 (되돌리기 토스트와 Delete 키 중복 대비).
        version을 받지 않는다(다른 곳에서 고친 업무도 보관할 수 있다).
      responses:
        '204':
          description: 보관됨
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/worklog/tasks/{taskId}/restore:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [tasks]
      operationId: restoreTask
      summary: 보관한 업무 복원 (되돌리기 토스트, 보관함)
      description: deletedAt을 비운다. 보관하지 않은 업무면 그대로 200.
      responses:
        '200':
          description: 복원 후 전체
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/worklog/schedules:
    get:
      tags: [schedules]
      operationId: listOccurrences
      summary: 기간 안의 일정 회차 (캘린더 일·주·월·연·목록 보기)
      description: |
        [from, to)와 겹치는 회차를 시작 시각순으로 준다. 반복 일정은 이 기간의 회차로 전개하고,
        "이 일정만"으로 바꾼 회차는 바뀐 값으로, 삭제한 회차는 빼고 준다.
        겹침 판단: 시간 일정은 [startAt, endAt), 종일 일정은 일정 시간대(timezone)의 [startDate 0시, endDate 다음 날 0시).
        기간은 최대 400일(연 보기 대비). 페이지네이션 없이 한 번에 준다.
        taskId를 주면 그 업무에 연결된 일정의 회차만 준다(업무 상세의 연결 일정). 다른 사용자의 업무이거나
        없는 업무면 빈 목록이다(존재 여부를 드러내지 않음).
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          description: from보다 뒤, from + 400일 이내
          schema:
            type: string
            format: date-time
        - name: taskId
          in: query
          required: false
          description: 이 업무에 연결된 일정의 회차만
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Occurrence'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [schedules]
      operationId: createSchedule
      summary: 일정 추가 (반복 포함)
      description: |
        timezone은 사용자 프로필의 현재 시간대로 정해지며 바꿀 수 없다(반복 전개·종일 날짜의 기준, D-40).
        프로필 사본이 없으면 identity에서 바로 가져온다(실패하면 503).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleCreate'
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ProfileUnavailable'
  /api/worklog/schedules/{scheduleId}:
    parameters:
      - $ref: '#/components/parameters/ScheduleId'
    get:
      tags: [schedules]
      operationId: getSchedule
      summary: 일정 조회 (반복 일정은 원본 규칙)
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [schedules]
      operationId: updateSchedule
      summary: 일정 수정 — 반복 일정이면 "모든 일정" (SCR-CAL-08)
      description: |
        보낸 칸만 바꾼다. 종일 여부를 바꾸면 새 종류의 시각 칸(startAt·endAt 또는 startDate·endDate)을 함께 보내야 한다.
        반복 일정에서 시각(startAt·endAt·startDate·endDate·allDay)이나 recurrence를 바꾸면 "이 일정만"으로 바꾸거나 삭제한 회차 기록을 모두 지운다
        (회차의 기준 시각이 달라지기 때문). 제목·메모·연결 업무만 바꾸면 회차 기록은 남고, 회차에서 따로 바꾼 칸은 회차 값이 그대로 보인다.
        recurrence에 null을 보내면 반복을 없앤다(원본 시각의 일정 하나만 남는다).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchedulePatch'
      responses:
        '200':
          description: 수정 후 전체
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
    delete:
      tags: [schedules]
      operationId: deleteSchedule
      summary: 일정 삭제 — 반복 일정이면 "모든 일정"
      description: 일정과 회차 기록을 함께 지운다(되돌릴 수 없음). 이미 없으면 404. version을 받지 않는다.
      responses:
        '204':
          description: 삭제됨
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/worklog/schedules/{scheduleId}/occurrences/{occurrenceStart}:
    parameters:
      - $ref: '#/components/parameters/ScheduleId'
      - $ref: '#/components/parameters/OccurrenceStart'
    patch:
      tags: [schedules]
      operationId: updateOccurrence
      summary: 반복 일정의 한 회차만 수정 — "이 일정만" (SCR-CAL-08, 블록 이동 포함)
      description: |
        제목·메모·시각만 바꿀 수 있다(종일 여부·반복·연결 업무는 일정 전체 수정으로).
        시각은 일정의 종류에 맞는 칸(시간 일정: startAt·endAt, 종일: startDate·endDate)만 받는다. 다른 회차와 겹치게 옮겨도 된다.
        version은 일정(Schedule)의 version이다. 성공하면 일정의 version이 오른다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OccurrencePatch'
      responses:
        '200':
          description: 수정한 회차
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Occurrence'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 일정이 없거나 occurrenceStart가 그 일정의 회차가 아님(이미 삭제한 회차 포함) (code=NOT_FOUND)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: version 불일치(code=VERSION_CONFLICT) 또는 반복 일정이 아님(code=NOT_RECURRING, 일정 전체 API를 쓴다)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      tags: [schedules]
      operationId: deleteOccurrence
      summary: 반복 일정의 한 회차만 삭제 — "이 일정만"
      description: 그 회차를 목록에서 뺀다. 일정의 version이 오른다. version을 받지 않는다. 이미 삭제한 회차면 204.
      responses:
        '204':
          description: 삭제됨
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 반복 일정이 아님 (code=NOT_RECURRING)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/worklog/records:
    get:
      tags: [records]
      operationId: listRecords
      summary: 기간 안의 업무 기록 (일 보기 "이날의 기록", 업무 상세 기록 이력, 일지 원본)
      description: |
        workDate가 [from, to](양끝 포함)인 기록을 준다. 보관(소프트 삭제)한 기록은 빼고 준다.
        정렬: workDate → startAt(없으면 뒤) → occurrenceStart(없으면 뒤) → id. 페이지네이션 없이 한 번에 준다(기간 최대 400일).
        status를 생략하면 세 상태를 모두 준다(일 보기는 확인 대기·하지 않음도 상태로 그린다, SCR-CAL-01 states).
        P2-03부터: from과 to가 같은 날이면 그날 끝난 회차의 확인 대기 기록을 먼저 만든다(7일 범위와 관계없이, D-39).
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: from 이후(같아도 됨), from + 400일 이내
          schema:
            type: string
            format: date
        - name: status
          in: query
          description: 여러 개면 OR
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/WorkRecordStatus'
        - name: taskId
          in: query
          description: 이 업무에 연결된 기록만 (업무 상세 기록 이력). 다른 사용자·없는 업무면 빈 목록
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkRecord'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [records]
      operationId: createRecord
      summary: 업무 기록 추가 — 직접 쓴 기록은 바로 확정 (REC-01, SCR-REC-01)
      description: |
        사용자가 직접 쓴 기록이라 status=CONFIRMED로 만든다(확인 대기는 서버만 만든다, P2-03).
        날짜 귀속(D-40, NFR-04): startAt이 있으면 workDate는 저장 시점 사용자 시간대(프로필)로 startAt의 날짜를 계산하고
        보낸 workDate는 무시한다. startAt이 없으면 workDate가 필수다.
        시간 칸은 시간 기록 옵션(WorklogSettings.timeTrackingEnabled)과 관계없이 받는다(옵션은 화면 표시만 바꾸고 데이터는 보존, TIME-09).
        startAt이 있는데 프로필 사본이 없으면 identity에서 바로 가져온다(실패하면 503).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkRecordCreate'
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkRecord'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ProfileUnavailable'
  /api/worklog/records/pending:
    get:
      tags: [records]
      operationId: listPendingRecords
      summary: 확인 대기 목록 (P2-03 — SCR-HOME-01 확인 대기 띠·요약 카드, SCR-HOME-02, 하루 마감 1단계)
      description: |
        먼저 끝난 회차의 확인 대기 기록을 만들고(D-31, 보여줄 때 생성) 확인 대기 기록을 준다. 요약 카드의 개수는 items 길이다.
        범위(D-39): 사용자의 현재 시간대 기준 오늘을 포함한 최근 7일(오늘-6일 ~ 오늘). 기록의 workDate로 판단한다.
        생성 대상:
        - 업무가 연결된 일정(taskId 있음, 반복 회차 포함)만. 연결 업무가 보관 상태면 만들지 않는다.
        - 회차가 끝났어야 한다(끝 시각 ≤ 지금, 종일 일정은 마지막 날 다음 날 0시, 일정 시간대).
        - workDate는 회차 시작의 일정 시간대 날짜(NFR-04). 취소한 회차는 만들지 않는다.
        - 이미 (일정, 회차 시작) 기록이 있으면 상태·보관 여부와 관계없이 다시 만들지 않는다(UNIQUE, 동시 호출에도 하나).
        만드는 값: status=PENDING, content=회차 제목, taskId=일정의 업무, scheduleId·occurrenceStart=회차 키.
        시간 칸(startAt·endAt·durationMin)은 비운다(계획 시간은 실제 시간이 아니다 — 시간 기록 옵션 P2-06에서 사용자가 넣는다).
        7일이 지난 확인 대기 기록은 상태를 유지한 채 여기서 빠진다(일 보기에서는 보이고 처리할 수 있다).
        정렬: workDate → plan 시작 → id. 보관한 기록은 빼고 준다.
      responses:
        '200':
          description: 확인 대기 기록 (최근 7일)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PendingRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ProfileUnavailable'
  /api/worklog/records/pending/confirm:
    post:
      tags: [records]
      operationId: confirmPendingRecords
      summary: 모두 했어요 (P2-03 — SCR-HOME-02 ③)
      description: |
        보낸 id의 확인 대기 기록을 한 번에 CONFIRMED로 바꾼다. 화면에 보인 것만 확정하도록 id를 받는다
        (목록을 받은 뒤 새로 생긴 확인 대기는 확정하지 않는다 — 확인은 반드시 사람이, REC-03).
        최근 7일 범위 밖, 이미 처리함(CONFIRMED·DISMISSED), 보관함, 다른 사용자·없는 id는 건너뛴다(오류 아님, 멱등).
        version을 받지 않는다(확인 대기 → 확정만 하므로 덮어쓸 내용이 없다). 되돌리기는 응답의 version으로 각 기록을 PATCH status=PENDING.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 200
                  uniqueItems: true
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: 이번 요청으로 확정한 기록 (건너뛴 것은 빠짐)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkRecord'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ProfileUnavailable'
  /api/worklog/records/{recordId}:
    parameters:
      - $ref: '#/components/parameters/RecordId'
    get:
      tags: [records]
      operationId: getRecord
      summary: 업무 기록 조회 (보관한 기록 포함)
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [records]
      operationId: updateRecord
      summary: 업무 기록 수정·확인·하지 않음 (SCR-REC-01, SCR-HOME-02 했어요/수정/안 했어요, 되돌리기)
      description: |
        보낸 칸만 바꾼다. 상태 전이:
        - 계획에서 온 기록(scheduleId 또는 occurrenceStart가 있음): PENDING·CONFIRMED·DISMISSED 사이 어느 쪽으로든
          (했어요 = CONFIRMED, 안 했어요 = DISMISSED, 되돌리기 토스트 = PENDING). "수정"은 내용과 status=CONFIRMED를 한 요청에 보낸다.
        - 직접 쓴 기록: CONFIRMED만(다른 값이면 409 INVALID_STATUS). 지우려면 DELETE.
        startAt을 바꾸면 workDate를 저장 시점 사용자 시간대로 다시 계산한다. startAt을 null로 비우면 workDate는 그대로 두거나 보낸 값으로 바꾼다.
        보관한 기록은 수정할 수 없다(409 RECORD_DELETED, 먼저 복원).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkRecordPatch'
      responses:
        '200':
          description: 수정 후 전체
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkRecord'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: version 불일치(code=VERSION_CONFLICT), 직접 쓴 기록의 상태 변경(code=INVALID_STATUS), 보관한 기록(code=RECORD_DELETED)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          $ref: '#/components/responses/ProfileUnavailable'
    delete:
      tags: [records]
      operationId: deleteRecord
      summary: 업무 기록 보관 (소프트 삭제, SCR-REC-01 ⑦)
      description: |
        deletedAt을 기록한다. 이미 보관했으면 204. version을 받지 않는다.
        계획에서 온 기록은 보관해도 (일정, 회차 시작) 행이 남으므로 확인 대기가 다시 생기지 않는다.
      responses:
        '204':
          description: 보관됨
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/worklog/records/{recordId}/restore:
    parameters:
      - $ref: '#/components/parameters/RecordId'
    post:
      tags: [records]
      operationId: restoreRecord
      summary: 보관한 기록 복원 (되돌리기 토스트)
      description: deletedAt을 비운다. 보관하지 않은 기록이면 그대로 200.
      responses:
        '200':
          description: 복원 후 전체
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '[P2-06] 보관 중 실행 중이던 타이머인데 지금 다른 타이머가 실행 중 (code=TIMER_RUNNING, 동시 1개)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  # ───────── P2-06·P2-07 (2026-10-07 확정) ─────────
  /api/worklog/timer:
    get:
      tags: [timer]
      operationId: getTimer
      summary: '지금 실행 중인 타이머 (P2-06, SCR-COM-06)'
      description: |
        타이머는 따로 저장하지 않는다. 실행 중 타이머 = startAt이 있고 endAt·durationMin이 없는 보관하지 않은 기록(WorkRecord, CONFIRMED).
        사용자당 하나뿐이다(DB 부분 UNIQUE 인덱스, TIME-03 동시 1개). 브라우저를 닫아도 서버의 startAt 기준으로 이어진다.
        시간 기록 옵션이 꺼져 있어도 응답한다(옵션은 화면 표시만 바꾼다, TIME-09).
      responses:
        '200':
          description: running이 null이면 실행 중인 타이머 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimerState'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/worklog/timer/start:
    post:
      tags: [timer]
      operationId: startTimer
      summary: '타이머 시작 — 실행 중인 타이머는 자동 정지 (P2-06, TIME-03·10)'
      description: |
        한 트랜잭션에서 (1) 실행 중인 타이머가 있으면 지금 시각으로 정지하고(정지 규칙은 /timer/stop과 같다)
        (2) startAt=지금, status=CONFIRMED인 새 기록을 만든다. workDate는 지금의 사용자 시간대 날짜(D-40).
        본문:
        - taskId만: content는 업무 제목. content를 함께 보내면 그 값.
        - content만: 업무 없이 시작.
        - scheduleId+occurrenceStart(이어달리기, TIME-10): 그 회차를 가져간다. 회차의 확인 대기 기록이 있으면 그 기록을
          실행 중으로 바꾸고(startAt=지금, CONFIRMED), 없으면 회차 키를 단 새 기록을 만든다. 그래서 회차가 끝나도 확인 대기가
          따로 생기지 않는다(같은 계획이 두 번 세어지지 않게). taskId·content를 안 보내면 회차의 업무·제목을 쓴다.
          그 회차의 기록이 이미 확정·하지 않음·보관이면 409 ALREADY_RECORDED.
        시간 기록 옵션이 꺼져 있으면 409 TIME_TRACKING_DISABLED.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimerStart'
      responses:
        '200':
          description: 새로 실행 중인 타이머와, 자동 정지한 앞 타이머(없으면 null)
          content:
            application/json:
              schema:
                type: object
                required: [running, stopped]
                properties:
                  running:
                    $ref: '#/components/schemas/WorkRecord'
                  stopped:
                    oneOf:
                      - $ref: '#/components/schemas/TimerStopped'
                      - type: 'null'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 회차(scheduleId·occurrenceStart)가 없거나 취소됨 (code=NOT_FOUND)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 시간 기록 옵션 꺼짐(code=TIME_TRACKING_DISABLED), 그 회차는 이미 기록됨(code=ALREADY_RECORDED)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          $ref: '#/components/responses/ProfileUnavailable'
  /api/worklog/timer/stop:
    post:
      tags: [timer]
      operationId: stopTimer
      summary: '타이머 정지 + 이어달리기 제안 (P2-06, TIME-03·10)'
      description: |
        실행 중인 타이머의 endAt을 지금으로 채운다. 실행 중인 타이머가 없으면 stopped=null(멱등, 200).
        - 1분이 안 되면 기록을 지운다(실수로 누른 타이머, discarded=true, 하드 삭제). durationMin 최소 1분 규칙(P2-01) 때문.
          회차를 가져간 기록이면 지우지 않고 시간 칸만 비워 확인 대기(PENDING)로 되돌린다.
        - 24시간을 넘으면 endAt=startAt+24시간으로 멈추고 capped=true(소요시간 최대 1440분, P2-01). 화면은 안내 후 수정을 권한다.
        - 시간 기록 옵션과 관계없이 동작한다(꺼진 상태에서도 남은 타이머를 멈출 수 있게).
        이어달리기(next, TIME-10): 사용자 시간대 오늘의 시간 일정 회차(종일·취소 제외) 중 끝 시각이 지금 이후이고
        아직 기록이 없는 것 하나 — 지금 진행 중인 회차 우선, 그다음 시작이 가장 이른 회차. 없으면 null.
        업무가 없는 회차도 제안한다(제목으로 시작). 수락하면 화면이 /timer/start에 회차 키를 보낸다.
      responses:
        '200':
          description: 정지 결과와 이어달리기 제안
          content:
            application/json:
              schema:
                type: object
                required: [stopped, next]
                properties:
                  stopped:
                    oneOf:
                      - $ref: '#/components/schemas/TimerStopped'
                      - type: 'null'
                  next:
                    oneOf:
                      - $ref: '#/components/schemas/PlanBlock'
                      - type: 'null'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ProfileUnavailable'
  /api/worklog/records/time-summary:
    get:
      tags: [records]
      operationId: getTimeSummary
      summary: '소요시간 집계 (P2-07, TIME-07 — SCR-LOG-02 P3, SCR-STAT-01 P4가 쓴다)'
      description: |
        workDate가 [from, to](양끝 포함, 최대 400일)인 확정(CONFIRMED)·보관하지 않은 기록의 durationMin을 더한다.
        일·주·월은 화면이 기간으로 정한다(주는 프로필의 주 시작 요일로 화면이 계산). 실행 중 타이머와 시간 없는 기록은 빼고 recordCount에도 넣지 않는다.
        겹친 기록은 겹친 만큼 두 번 센다(겹침은 경고일 뿐 저장되므로, TIME-06). 프로젝트는 연결 업무의 지금 프로젝트다.
        업무 없는 기록은 taskId=null 한 줄로, 프로젝트 없는 업무는 projectId=null 한 줄로 묶는다. 정렬: minutes 내림차순 → id.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 집계 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeSummary'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/worklog/records/gaps:
    get:
      tags: [records]
      operationId: listTimeGaps
      summary: '빈 시간과 후보 (P2-07, TIME-11 — SCR-HOME-03, 하루 마감 1단계)'
      description: |
        date의 업무 시간대(WorklogSettings.workHoursStart~End, 사용자의 현재 시간대) 중 기록이 없는 구간을 준다.
        - 덮은 구간: 보관하지 않은 확정 기록의 [startAt, endAt), 실행 중 타이머는 [startAt, 지금). workDate와 관계없이 시각으로 본다(자정 넘은 기록 포함).
        - 오늘이면 지금 이후는 빼고, 미래 날짜면 빈 배열. 15분 미만 구간은 뺀다.
        - 업무 요일(work_days)이 아닌 날도 계산한다(표시 여부는 화면이 정한다).
        구간마다 후보 3종(없으면 null):
        - previous: 구간 시작 이전에 끝난 가장 가까운 같은 날 시간 기록(직전 업무 이어서).
        - plan: 구간과 가장 많이 겹치는 시간 일정 회차(취소 제외, 이미 확정·하지 않음·보관한 회차 제외). 그 회차의 확인 대기 기록이 있으면 pendingRecordId를 준다.
          계산 전에 그날 끝난 회차의 확인 대기를 만든다(D-31, 보여줄 때 생성).
          화면은 새로 만들지 말고 그 기록을 PATCH(startAt·endAt·status=CONFIRMED)한다(같은 계획이 두 번 세어지지 않게).
        - frequent: 구간 시작 시각 기준 자주 하는 업무(GET /tasks/frequent?at=)의 1위.
        채우기는 기존 API를 쓴다: 새 기록은 POST /records(startAt·endAt=구간), 확인 대기는 PATCH /records/{id}.
        시간 기록 옵션과 관계없이 응답한다.
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 빈 구간 (시간순)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TimeGap'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ProfileUnavailable'
  /api/worklog/logs:
    get:
      tags: [logs]
      operationId: listLogPeriods
      summary: '일지 목록 — 기간별 상태 (P3-08 LOG-09 SCR-LOG-01, 홈 이번 주 현황 SCR-HOME-01 ⑦)'
      description: |
        [from, to] 안의 기간마다 한 줄을 준다. 일지가 없는 기간도 준다(미작성·기록 없음 표시용).
        - type=DAILY: 날마다. 홈 ⑦은 이번 주 from~to로 부르고, 오늘 뒤의 날은 화면이 "예정"으로 그린다.
        - type=WEEKLY: from~to와 겹치는 주(주 시작 요일 기준)마다. type=MONTHLY: 겹치는 달마다.
        상태(status):
        - CONFIRMED / DRAFT: 저장된 일지의 상태.
        - NOT_WRITTEN(미작성): 일지는 없고 원본이 있다. 원본 = 보관하지 않은 확정·확인 대기 기록, 또는 그 기간에 완료한 업무.
        - NO_RECORDS(기록 없음): 일지도 원본도 없다(미래 날짜 포함).
        unconfirmedDays는 [from, min(to, 오늘)] 중 원본이 있는데 일간 일지가 확정이 아닌 날 수다(SCR-LOG-01 ⑤ 상단 띠).
        기간은 최대 400일. 정렬: periodStart 오름차순.
      parameters:
        - $ref: '#/components/parameters/LogTypeQuery'
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 기간별 상태
          content:
            application/json:
              schema:
                type: object
                required: [items, unconfirmedDays]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/LogPeriod'
                  unconfirmedDays:
                    type: integer
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ProfileUnavailable'
  /api/worklog/logs/{type}/{periodStart}:
    get:
      tags: [logs]
      operationId: getLog
      summary: '일지 보기 — 없으면 저장하지 않은 미리보기 (P3-03·07 SCR-LOG-02, 홈 오늘 일지 카드 LOG-12 SCR-HOME-01 ⑤)'
      description: |
        저장된 일지가 있으면 그 일지를, 없으면 원본으로 만든 미리보기(id=null, status=NOT_WRITTEN 또는 NO_RECORDS, version=0)를 준다.
        미리보기는 저장하지 않는다(홈 카드가 기록할 때마다 다시 불러도 행이 생기지 않는다).
        초안은 실적이 자동 상태면 읽을 때마다 원본으로 다시 만든다. 확정 일지는 스냅샷을 준다.
        일간 생성 규칙(LOG-01·02·15, P3-03):
        - 실적: 그날 workDate의 확정 기록(보관 제외, 실행 중 타이머 제외)을 정렬 순서대로 한 줄씩(source=RECORD).
          그날(사용자 시간대) 완료한 업무 중 그날 기록이 없는 업무는 업무 제목으로 한 줄(source=TASK, outcome=DONE).
        - 확인 대기 기록은 실적에서 빼고 metrics.pendingCount로만 센다(SCR-LOG-02 states).
        - 소요시간 표(time): 시간 기록 옵션이 켜져 있을 때만, GET /records/time-summary와 같은 계산. 꺼져 있으면 null.
        - 계획(plans)은 비어서 시작하고, 후보(planCandidates)를 칩으로 준다: 진행 중 업무, 다음 계획 기간 끝까지 마감인 미완료 업무,
          마감이 지난 미완료 업무(보관·보류 제외, 마감순 최대 20개).
        - 계획 제목: 일간 "다음 근무일 계획"(다음 근무일이 다음 주면 "다음 주 계획", LOG-14), 주간 "다음 주 계획", 월간 "다음 달 계획".
        주간·월간 생성 규칙(LOG-07·08, P3-07): 기간의 날마다 확정된 일간 일지가 있으면 그 스냅샷 실적을, 없으면 그날 원본을 쓰고
        days[]에 날마다 출처를 표시한다(미확정 일 = source RECORDS). 실적은 업무별로 묶고(업무 없는 기록은 한 줄씩), 월간은 projects[]에
        프로젝트별 완료 업무 수·기록 수·(옵션) 소요시간을 넣는다.
      parameters:
        - $ref: '#/components/parameters/LogTypePath'
        - $ref: '#/components/parameters/PeriodStart'
      responses:
        '200':
          description: 일지 또는 미리보기
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkLog'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ProfileUnavailable'
    post:
      tags: [logs]
      operationId: createLog
      summary: '초안 만들기 (SCR-LOG-01 미작성 날짜 클릭, LOG-16 주간·월간 제안 수락)'
      description: |
        그 기간의 초안을 만든다(실적 자동 상태, 계획·이슈 비움). 이미 있으면 만들지 않고 있는 일지를 200으로 준다(멱등, UNIQUE).
        기간 시작일이 오늘(사용자 시간대)보다 뒤면 400(periodStart, OUT_OF_RANGE). 원본이 없어도 만들 수 있다(LOG-16 "직접 만들기").
      parameters:
        - $ref: '#/components/parameters/LogTypePath'
        - $ref: '#/components/parameters/PeriodStart'
      responses:
        '200':
          description: 이미 있던 일지
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkLog'
        '201':
          description: 만듦
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkLog'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ProfileUnavailable'
  /api/worklog/logs/{logId}:
    patch:
      tags: [logs]
      operationId: patchLog
      summary: '초안 고치기 — 자동 저장 (LOG-03·04, SCR-LOG-02)'
      description: |
        보낸 칸만 바꾼다. achievements를 보내면 실적이 자동 상태에서 벗어나 보낸 목록이 그대로 저장된다
        (행 추가·삭제·순서 변경은 목록 전체를 보낸다, 원본 기록 끌어오기는 recordIds를 단 행을 넣어 보낸다).
        plans·issues도 같다. 확정한 일지는 409(code=LOG_CONFIRMED).
      parameters:
        - $ref: '#/components/parameters/LogId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkLogPatch'
      responses:
        '200':
          description: 고친 일지
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkLog'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/LogConflict'
  /api/worklog/logs/{logId}/refill:
    post:
      tags: [logs]
      operationId: refillLog
      summary: '원본에서 다시 채우기 (LOG-04, SCR-LOG-02 — 화면이 경고창을 먼저 띄운다)'
      description: |
        실적을 자동 상태로 되돌린다(직접 고친 실적은 사라진다). 계획·이슈는 원본에서 오지 않으므로 그대로 둔다.
      parameters:
        - $ref: '#/components/parameters/LogId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionOnly'
      responses:
        '200':
          description: 다시 채운 일지
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkLog'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/LogConflict'
  /api/worklog/logs/{logId}/confirm:
    post:
      tags: [logs]
      operationId: confirmLog
      summary: '확정 — 스냅샷 저장 (LOG-05, P3-02)'
      description: |
        지금 보이는 내용 전체(머리의 작성자 이름·소속·직책 포함)를 스냅샷으로 저장하고 status=CONFIRMED, 변경 이력에 확정 한 줄(revision)을 더한다.
        작성자 프로필이 비어 있어도 확정한다(SCR-ONB-01 "나중에" — 빈칸으로 남김). 이미 확정이면 409(LOG_CONFIRMED).
      parameters:
        - $ref: '#/components/parameters/LogId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionOnly'
      responses:
        '200':
          description: 확정한 일지
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkLog'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/LogConflict'
        '503':
          $ref: '#/components/responses/ProfileUnavailable'
  /api/worklog/logs/{logId}/unconfirm:
    post:
      tags: [logs]
      operationId: unconfirmLog
      summary: '확정 해제 (LOG-06, SCR-LOG-04 — 화면이 확인창을 먼저 띄운다)'
      description: |
        status=DRAFT로 되돌리고 마지막 확정 이력에 해제 시각을 적는다. 내용은 확정본 그대로 초안이 된다(실적은 자동 상태가 아니다).
        원본으로 다시 만들려면 다시 채우기를 쓴다. 이미 초안이면 409(code=LOG_NOT_CONFIRMED).
      parameters:
        - $ref: '#/components/parameters/LogId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionOnly'
      responses:
        '200':
          description: 초안으로 돌린 일지
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkLog'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/LogConflict'
  /api/worklog/logs/{logId}/revisions:
    get:
      tags: [logs]
      operationId: listLogRevisions
      summary: '변경 이력 — 확정·해제 일시 (LOG-06, SCR-LOG-04 ②)'
      description: 확정할 때마다 한 줄. 최근 것부터. 초안 편집(자동 저장)은 이력에 남기지 않는다.
      parameters:
        - $ref: '#/components/parameters/LogId'
      responses:
        '200':
          description: 이력
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/LogRevision'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/worklog/logs/{logId}/revisions/{revisionNo}:
    get:
      tags: [logs]
      operationId: getLogRevision
      summary: '확정본 열람 (SCR-LOG-04 ②)'
      parameters:
        - $ref: '#/components/parameters/LogId'
        - name: revisionNo
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: 그때의 확정본
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogRevisionDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/worklog/logs/daily/{date}/close:
    get:
      tags: [logs]
      operationId: getDailyClose
      summary: '하루 마감 준비 — 2단계 이월 후보와 마감 뒤 제안 (LOG-13·14·16, SCR-LOG-03)'
      description: |
        1단계(확인 대기·빈 시간)는 기존 GET /records/pending·/records/gaps를 쓴다. pendingCount가 0이면 화면은 1단계를 건너뛴다.
        이월 후보(LOG-14): 보관하지 않은 TODO·IN_PROGRESS 업무 중 ① 그날 기록이 있거나 ② 마감일이 다음 근무일 이하이거나(지난 마감 포함)
        ③ IN_PROGRESS인 업무. 기본 전체 선택(selected=true), 마감순(없으면 뒤) → 제목.
        nextWorkday는 date 다음 날부터 찾은 첫 근무일(비근무일 마감도 다음 근무일, LOG-13).
        planScope: date가 주 마지막 근무일이면 NEXT_WEEK("다음 주 계획"), 아니면 NEXT_WORKDAY.
        suggestions: 마감 뒤 이어서 제안할 주간 → 월간(LOG-16). date가 근무일이고 그 주(월)의 마지막 근무일일 때만.
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 마감 준비 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyClosePlan'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ProfileUnavailable'
    post:
      tags: [logs]
      operationId: closeDay
      summary: '하루 마감 — 이월·이슈를 넣고 일간 일지 확정 (LOG-13·14, SCR-LOG-03 3단계 확정)'
      description: |
        한 트랜잭션으로: 그날 일간 초안이 없으면 만들고 → 선택한 업무를 계획(plans)에 더하고(이미 같은 업무가 있으면 그대로) →
        issue가 비어 있지 않으면 이슈 칸 끝에 한 줄로 덧붙이고 → 확정한다(스냅샷·이력).
        업무 자체(상태·마감일)는 바꾸지 않는다(이월 = 계획에 넣기). version은 일지가 없으면 0.
        이미 확정이면 409(LOG_CONFIRMED, 화면 "확정 해제 후 다시 마감할 수 있어요"). 오늘보다 뒤 날짜는 400(date, OUT_OF_RANGE).
        중간에 닫으면 화면은 이 요청을 보내지 않는다(1단계에서 처리한 기록은 이미 저장됨, 일지는 초안 또는 미작성 그대로).
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
            format: date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailyCloseRequest'
      responses:
        '200':
          description: 확정한 일간 일지와 이어서 할 제안
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyCloseResult'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/LogConflict'
        '503':
          $ref: '#/components/responses/ProfileUnavailable'
  /api/worklog/logs/{type}/{periodStart}/export:
    get:
      tags: [logs]
      operationId: exportLog
      summary: '일지 파일 내보내기 — PDF·Word·Excel (EXP-02~04, P3-10, SCR-LOG-05)'
      description: |
        확정 일지는 스냅샷으로, 초안·미리보기는 지금 내용으로 만든다(초안 경고는 화면 몫, 서버는 허용).
        서식(P3-09, docs/업무일지_서식명세.md)은 표준 업무일지: 결재란(담당·팀장·부서장, 빈칸)을 넣는다.
        XLSX는 시트 1 일지, 시트 2 "기록"(그 일지 기간의 원본 기록 — 열·규칙은 GET /records/export와 같다). 한글 폰트를 넣는다(NFR-11). 파일 생성 라이브러리는 P3-01 검증 뒤 정한다.
        이메일 인증(AUTH-08): 인증하지 않은 사용자는 403(code=EMAIL_NOT_VERIFIED) — 화면은 SCR-LOG-06을 띄우고 인증 뒤 같은 요청을 다시 보낸다.
        인증 확인: worklog가 기억한 인증이 없으면 사용자 토큰으로 identity GET /api/users/me의 emailVerified를 본다
        (프로필 즉시 조회와 같은 경로, 인증은 되돌아가지 않아 true만 기억). 확인하지 못하면 503(code=IDENTITY_UNAVAILABLE).
        파일명: 업무일지_{기간 시작일 YYYY-MM-DD}_{이름}.{pdf|docx|xlsx}. 이름의 / \ : * ? " < > |와 제어 문자는 _로 바꾸고,
        이름이 비어 있으면 "_{이름}"을 뺀다. 헤더(RFC 6266):
        Content-Disposition: attachment; filename="{ASCII 대체 이름}"; filename*=UTF-8''{퍼센트 인코딩한 파일명}
        (ASCII 대체 이름은 비ASCII 글자를 뺀 worklog_{기간 시작일}.{확장자}).
        텍스트 복사(EXP-01)는 이 API를 쓰지 않는다: 화면이 WorkLog를 서식 있는 텍스트로 만들어 복사하고(결재란 없음, LOG-02),
        인증 요구는 화면 안내다(AUTH-08).
      parameters:
        - $ref: '#/components/parameters/LogTypePath'
        - $ref: '#/components/parameters/PeriodStart'
        - $ref: '#/components/parameters/ExportFormat'
      responses:
        '200':
          $ref: '#/components/responses/ExportFile'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/EmailNotVerified'
        '503':
          $ref: '#/components/responses/IdentityUnavailable'
  /api/worklog/records/export:
    get:
      tags: [records]
      operationId: exportRecords
      summary: '기간 업무 기록 Excel (EXP-03, SCR-LOG-05 ② "기간 업무 기록")'
      description: |
        workDate가 [from, to](최대 400일)인 보관하지 않은 기록(세 상태 모두, 상태 열 포함)을 한 행씩. 실행 중 타이머는 뺀다.
        열: 날짜, 내용, 업무, 프로젝트, 상태, 결과, 결과 칩, 진행률, 시작·종료·소요시간(분, 값이 있으면 — 옵션과 관계없이).
        Excel만. 이메일 인증·헤더 규칙은 exportLog와 같고, 파일명은 업무기록_{from}_{to}_{이름}.xlsx.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          $ref: '#/components/responses/ExportFile'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/EmailNotVerified'
        '503':
          $ref: '#/components/responses/IdentityUnavailable'

  /api/worklog/stats:
    get:
      tags: [stats]
      operationId: getStats
      summary: '업무 통계 (P4-02, STAT-01 — SCR-STAT-01 ②③④)'
      description: |
        화면이 차트를 직접 그리므로 숫자만 준다.
        - 기간 [from, to] 양끝 포함, 최대 400일. 날짜는 사용자의 현재 시간대 기준.
        - 완료 업무: 보관하지 않은 업무 중 완료 시각(completedAt)의 날짜가 기간 안인 것. 지금 DONE이 아니면(완료 취소) 세지 않는다.
        - 기록: 보관하지 않은 확정(CONFIRMED) 기록, workDate 기준(확인 대기 제외).
        - 확정 일지: 상태 CONFIRMED이고 기간 시작일이 [from, to] 안인 일지(일간·주간·월간 합).
        - daily: from부터 to까지 하루도 빠짐없이(0 포함) 날짜순. 주·월 막대는 화면이 프로필 주 시작 요일로 묶는다.
        - projects: 프로젝트별 완료 업무 수·기록 수. 프로젝트는 업무의 지금 프로젝트, 업무 없는 기록·프로젝트 없는 업무는 projectId=null 한 줄.
          둘 다 0인 프로젝트는 넣지 않는다. 정렬: completedTaskCount 내림차순 → recordCount 내림차순 → projectId.
          소요시간 비중(⑤)은 기존 GET /records/time-summary를 같은 기간으로 부른다.
        - firstRecordDate: 이 사용자의 첫 확정 기록 workDate(기간과 무관, 없으면 null). "1주일 기록이 쌓이면" 판단은 화면이 한다.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 통계
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ProfileUnavailable'
  /api/worklog/stats/plan-vs-actual:
    get:
      tags: [stats]
      operationId: getPlanVsActual
      summary: '예상 대비 실제 회고 (P4-02, UX-05 — SCR-STAT-01 ⑥)'
      description: |
        업무 단위로 비교한다(계획 시간 정의는 카드 0401).
        - 예상(plannedMin): 업무에 연결된 시간 일정(allDay=false) 회차 중 취소하지 않은 것의 길이(분). 회차가 속한 주는 회차 시작 시각을 사용자 시간대 날짜로 바꿔 정한다.
          종일 일정·업무 없는 일정은 예상에 넣지 않는다.
        - 실제(actualMin): 보관하지 않은 확정 기록의 durationMin(시간 없는 기록 제외), workDate 기준. 기록의 업무로 묶는다(계획에서 온 기록인지와 무관).
        - 주: 프로필 주 시작 요일 기준. 기간 [from, to](최대 400일)와 겹치는 주를 모두 주되, 각 주는 기간 안 날짜만 센다(화면은 주 단위로 맞춰 보낸다).
        - weeks[]: 주마다 plannedMin(그 주 예상 합), actualMin(그 주 예상이 있는 업무의 실제 합), unplannedMin(그 주 예상이 없는 업무·업무 없는 기록의 실제 합).
        - topDiffs: 기간 전체에서 예상이 있는 업무를 |actualMin − plannedMin| 내림차순 → taskId로 최대 5개. 업무 제목은 지금 제목(보관 업무 포함).
        시간 기록 옵션과 관계없이 응답한다(꺼져 있으면 화면이 영역을 숨긴다).
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 주별 비교와 차이 큰 업무
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanVsActual'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ProfileUnavailable'
  /api/worklog/notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      summary: '알림 센터 목록 (P4-01, NOTI-01·LOG-16 — SCR-COM-05)'
      description: |
        최신순(createdAt 내림차순 → id). 30일이 지난 알림은 하루 1회 정리 작업이 지운다.
        unreadCount는 전체(페이지와 무관) 읽지 않은 수로, 사이드바 배지에 쓴다(배지는 limit=1로 불러도 된다).
      parameters:
        - name: cursor
          in: query
          description: 이전 응답의 nextCursor. 처음이면 생략.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        '200':
          description: 알림 목록
          content:
            application/json:
              schema:
                type: object
                required: [items, unreadCount]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'
                  unreadCount:
                    type: integer
                  nextCursor:
                    type: [string, 'null']
                    description: 다음 페이지가 없으면 null
        '400':
          description: cursor 형식이 틀림(code=INVALID_CURSOR) 또는 값 형식 오류(code=VALIDATION_FAILED)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/worklog/notifications/{notificationId}/read:
    post:
      tags: [notifications]
      operationId: markNotificationRead
      summary: 알림 하나 읽음 (항목 클릭, 웹 푸시 클릭으로 열 때)
      description: 이미 읽었으면 그대로 204(멱등).
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 읽음
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/worklog/notifications/read-all:
    post:
      tags: [notifications]
      operationId: markAllNotificationsRead
      summary: 모두 읽음 (SCR-COM-05 ②)
      responses:
        '204':
          description: 읽지 않은 알림을 모두 읽음으로
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/worklog/push/public-key:
    get:
      tags: [notifications]
      operationId: getPushPublicKey
      summary: 웹 푸시 VAPID 공개 키 (P4-01, SCR-SET-05 ③)
      description: |
        PushManager.subscribe의 applicationServerKey에 넣는 값(base64url, 비압축 P-256 공개 키 65바이트).
        공개 키라 비밀이 아니지만 서버 환경변수 하나(VAPID_PUBLIC_KEY)로 관리하려고 API로 준다.
      responses:
        '200':
          description: 공개 키
          content:
            application/json:
              schema:
                type: object
                required: [publicKey]
                properties:
                  publicKey:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/worklog/push/subscriptions:
    put:
      tags: [notifications]
      operationId: savePushSubscription
      summary: 이 브라우저의 푸시 구독 등록 (권한 허용 직후, 그리고 앱을 열 때마다 다시 보냄)
      description: |
        PushSubscription.toJSON()의 endpoint·keys를 그대로 보낸다. endpoint가 같으면 덮어쓴다(다른 사용자 것이었으면 이 사용자로 옮긴다 — 같은 브라우저에서 계정을 바꾼 경우).
        사용자당 최대 10개, 넘으면 가장 오래 쓰지 않은 구독을 지운다.
        보안(SSRF 방지): endpoint는 https이고 호스트가 알려진 푸시 서비스여야 한다 —
        fcm.googleapis.com, updates.push.services.mozilla.com, *.notify.windows.com, web.push.apple.com, *.push.apple.com. 아니면 400(errors[].field=endpoint).
        발송 때 푸시 서비스가 404·410을 주면 그 구독을 지운다.
        푸시 메시지 본문(서비스 워커 push 이벤트의 data.json()): {"type":"DAILY_CLOSE","notificationId":uuid,"title":string,"body":string|null,"url":"/logs/daily/{date}?close=1"}.
        서비스 워커는 title·body로 알림을 띄우고(tag=type), 누르면 notificationId를 읽음 처리하고 url을 연다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushSubscription'
      responses:
        '204':
          description: 저장됨
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [notifications]
      operationId: deletePushSubscription
      summary: 이 브라우저의 푸시 구독 해제 (알림 끄기·로그아웃 때)
      description: 없는 endpoint여도 204(멱등). 다른 사용자의 구독은 지우지 않는다.
      parameters:
        - name: endpoint
          in: query
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 지움
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    accessTokenCookie:
      type: apiKey
      in: cookie
      name: access_token
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TagId:
      name: tagId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ScheduleId:
      name: scheduleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OccurrenceStart:
      name: occurrenceStart
      in: path
      required: true
      description: 회차 키 (Occurrence.occurrenceStart를 그대로, 예 2026-10-06T00:00:00Z)
      schema:
        type: string
        format: date-time
    RecordId:
      name: recordId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LogId:
      name: logId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LogTypePath:
      name: type
      in: path
      required: true
      description: 경로에서는 소문자(daily·weekly·monthly) — 화면 경로 /logs/daily/:date와 맞춘다
      schema:
        type: string
        enum: [daily, weekly, monthly]
    LogTypeQuery:
      name: type
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/LogType'
    PeriodStart:
      name: periodStart
      in: path
      required: true
      description: 기간 시작일. 주간은 주 시작 요일의 날, 월간은 1일 (화면 경로 /logs/monthly/:yyyy-mm은 화면이 1일로 바꾼다)
      schema:
        type: string
        format: date
    ExportFormat:
      name: format
      in: query
      required: true
      schema:
        type: string
        enum: [PDF, DOCX, XLSX]
  responses:
    Unauthorized:
      description: |
        토큰 없음·만료·서명 오류(code=UNAUTHENTICATED), 또는 탈퇴한 사용자(code=USER_DELETED).
        프론트는 UNAUTHENTICATED일 때 refresh 1회 후 재시도한다 (P0-07).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ProfileUnavailable:
      description: identity 조회 실패 (code=PROFILE_UNAVAILABLE). 잠시 후 재시도.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: |
        입력 오류 (code=VALIDATION_FAILED). errors[]에 칸별 오류.
        errors[].code: REQUIRED, TOO_LONG, INVALID_FORMAT, OUT_OF_RANGE, NOT_FOUND(참조한 프로젝트·태그·업무가 없음),
        INVALID_ORDER(업무 시간대 종료가 시작보다 앞서거나 같음, 일정 종료가 시작보다 앞서거나 같음·종일 일정 endDate가 startDate보다 앞섬,
        목록 조회 to가 from보다 앞서거나 같음).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    VersionConflict:
      description: 다른 곳에서 먼저 수정됨 (code=VERSION_CONFLICT). 화면은 새로 불러오기를 안내한다 (화면정의서 2.5).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    DuplicateName:
      description: 같은 이름이 이미 있음 (code=DUPLICATE_NAME). 이름은 앞뒤 공백을 빼고 대소문자를 무시해 비교한다.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: 없거나 다른 사용자의 리소스 (code=NOT_FOUND)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    LogConflict:
      description: |
        일지 상태 충돌. code: VERSION_CONFLICT(다른 곳에서 먼저 고침 — 화면은 충돌 띠와 새로 불러오기·내 수정 복사, SCR-LOG-02),
        LOG_CONFIRMED(확정한 일지는 고칠 수 없음, 확정 해제 후), LOG_NOT_CONFIRMED(이미 초안).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    EmailNotVerified:
      description: 이메일 인증 전 (code=EMAIL_NOT_VERIFIED, AUTH-08). 화면은 SCR-LOG-06으로 인증을 받고 같은 요청을 다시 보낸다.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    IdentityUnavailable:
      description: identity에서 인증 여부를 확인하지 못함 (code=IDENTITY_UNAVAILABLE). 잠시 후 재시도.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ExportFile:
      description: 파일 (Content-Disposition attachment, RFC 6266 — filename과 filename*=UTF-8'' 둘 다)
      headers:
        Content-Disposition:
          required: true
          schema:
            type: string
          example: attachment; filename="worklog_2026-10-07.docx"; filename*=UTF-8''%EC%97%85%EB%AC%B4%EC%9D%BC%EC%A7%80_2026-10-07_%ED%99%8D%EA%B8%B8%EB%8F%99.docx
      content:
        application/pdf:
          schema:
            type: string
            format: binary
        application/vnd.openxmlformats-officedocument.wordprocessingml.document:
          schema:
            type: string
            format: binary
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema:
            type: string
            format: binary
  schemas:
    WorklogMe:
      type: object
      required: [userId, profile, settings]
      properties:
        userId:
          type: string
          format: uuid
          description: UUIDv7, JWT sub와 같음
        profile:
          $ref: '#/components/schemas/ProfileSnapshot'
        settings:
          $ref: '#/components/schemas/WorklogSettings'
    ProfileSnapshot:
      type: object
      description: identity 공통 프로필의 읽기 전용 사본 (UserSnapshot). worklog에서는 수정하지 않는다.
      required: [timezone, weekStart, workDays]
      properties:
        name:
          type: [string, 'null']
        organization:
          type: [string, 'null']
        position:
          type: [string, 'null']
          description: 표시용 직책
        timezone:
          type: string
          example: Asia/Seoul
        weekStart:
          type: string
          enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]
          example: MONDAY
        workDays:
          type: integer
          minimum: 0
          maximum: 127
          description: 비트마스크 월=1 … 일=64, 기본 31(월~금)
          example: 31
        syncedAt:
          type: string
          format: date-time
          description: 사본을 마지막으로 갱신한 시각 (UTC)
    WorklogSettings:
      type: object
      description: |
        worklog 전용 설정 (UserSetting). 행이 없으면 기본값과 version=0.
        P1에서 바뀐 점: 시각 칸은 null 없이 기본값을 준다(화면정의서 SCR-SET-02 기본값), version 추가.
      required: [timeTrackingEnabled, workHoursStart, workHoursEnd, dailyCloseTime, dailyCloseNotifyEnabled, version]
      properties:
        dailyCloseNotifyEnabled:
          type: boolean
          default: false
          description: |
            하루 마감 알림 켜기(SCR-SET-05 ①). 기본 꺼짐(카드 0401, 기존 사용자도 꺼짐). 켜면 앱 안 알림을 만들고, 푸시 구독이 있으면 웹 푸시도 보낸다.
            웹 푸시 권한은 브라우저마다 따로라 여기서 다루지 않는다(구독 API).
        timeTrackingEnabled:
          type: boolean
          default: false
        workHoursStart:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          default: '09:00'
          description: 사용자 시간대 기준 HH:mm
        workHoursEnd:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          default: '18:00'
          description: workHoursStart보다 늦어야 한다 (자정 넘는 업무 시간대 없음)
        dailyCloseTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          default: '18:00'
          description: 사용자 시간대 기준 하루 마감 시각
        version:
          type: integer
          format: int64
          minimum: 0
    WorklogSettingsPatch:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          format: int64
          description: 마지막으로 받은 version (행이 없으면 0)
        dailyCloseNotifyEnabled:
          type: boolean
        timeTrackingEnabled:
          type: boolean
        workHoursStart:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        workHoursEnd:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        dailyCloseTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'

    ProjectColor:
      type: string
      description: 프로젝트 전용 팔레트 8색의 키 (테마와 무관, 실제 색 값은 프론트 디자인 토큰). SCR-SET-08 ②
      enum: [P1, P2, P3, P4, P5, P6, P7, P8]
    Project:
      type: object
      required: [id, name, color, archived, taskCount, openTaskCount, createdAt, version]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 50
        color:
          $ref: '#/components/schemas/ProjectColor'
        archived:
          type: boolean
        archivedAt:
          type: [string, 'null']
          format: date-time
        taskCount:
          type: integer
          minimum: 0
          description: 보관(소프트 삭제)하지 않은 업무 수 (상태 무관)
        openTaskCount:
          type: integer
          minimum: 0
          description: 남은 업무 수. 보관하지 않았고 완료(DONE)가 아닌 업무 (사이드바 프로젝트 목록, SCR-COM-01). 2026-10-06 추가
        createdAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
    ProjectCreate:
      type: object
      required: [name, color]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: 앞뒤 공백은 빼고 저장한다
        color:
          $ref: '#/components/schemas/ProjectColor'
    ProjectPatch:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          format: int64
        name:
          type: string
          minLength: 1
          maxLength: 50
        color:
          $ref: '#/components/schemas/ProjectColor'
        archived:
          type: boolean

    Tag:
      type: object
      required: [id, name, usageCount, createdAt, version]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: '#은 붙이지 않는다'
        usageCount:
          type: integer
          minimum: 0
          description: 이 태그가 붙은 업무 중 보관하지 않은 업무 수
        createdAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
    TagName:
      type: string
      minLength: 1
      maxLength: 30
      pattern: '^[^\s#]+$'
      description: 공백과 '#' 없음 (빠른 입력의 #태그 문법과 맞춤)
    TagCreate:
      type: object
      required: [name]
      properties:
        name:
          $ref: '#/components/schemas/TagName'
    TagPatch:
      type: object
      required: [version, name]
      properties:
        version:
          type: integer
          format: int64
        name:
          $ref: '#/components/schemas/TagName'

    TaskStatus:
      type: string
      description: 할 일 / 진행 중 / 완료 / 보류 (TASK-02)
      enum: [TODO, IN_PROGRESS, DONE, ON_HOLD]
    TaskPriority:
      type: string
      description: 높음 / 보통 / 낮음 (TASK-03)
      enum: [HIGH, NORMAL, LOW]
    Task:
      type: object
      required: [id, title, status, priority, progress, tagIds, createdAt, updatedAt, version]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        dueDate:
          type: [string, 'null']
          format: date
          description: 마감 임박·초과 표시는 프론트가 사용자 시간대의 오늘과 비교해 계산한다
        progress:
          type: integer
          minimum: 0
          maximum: 100
          multipleOf: 10
        completedAt:
          type: [string, 'null']
          format: date-time
          description: status가 DONE일 때만 값이 있다
        projectId:
          type: [string, 'null']
          format: uuid
        tagIds:
          type: array
          items:
            type: string
            format: uuid
        hasSchedule:
          type: boolean
          description: 일정이 하나 이상 연결돼 있음 (반복 일정은 시리즈 하나로 센다). 업무 행의 일정 배치 아이콘(SCR-TASK-01 ⑤). 2026-10-06 추가
        memo:
          type: [string, 'null']
          maxLength: 5000
        carriedOverFromId:
          type: [string, 'null']
          format: uuid
          description: 이월 원본 업무 (읽기 전용, 이월 기능은 P3 LOG-13)
        deletedAt:
          type: [string, 'null']
          format: date-time
          description: 보관(소프트 삭제) 시각. 값이 있으면 읽기 전용
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
    TaskCreate:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: 앞뒤 공백은 빼고 저장한다
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        dueDate:
          type: [string, 'null']
          format: date
        progress:
          type: integer
          minimum: 0
          maximum: 100
          multipleOf: 10
          default: 0
        projectId:
          type: [string, 'null']
          format: uuid
        tagIds:
          type: array
          items:
            type: string
            format: uuid
        memo:
          type: [string, 'null']
          maxLength: 5000
      description: status 기본 TODO, priority 기본 NORMAL. status=DONE으로 만들면 completedAt을 기록한다.
    TaskPatch:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          format: int64
        title:
          type: string
          minLength: 1
          maxLength: 200
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        dueDate:
          type: [string, 'null']
          format: date
        progress:
          type: integer
          minimum: 0
          maximum: 100
          multipleOf: 10
        projectId:
          type: [string, 'null']
          format: uuid
        tagIds:
          type: array
          items:
            type: string
            format: uuid
        memo:
          type: [string, 'null']
          maxLength: 5000

    FrequentTaskList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/FrequentTask'
    FrequentTask:
      type: object
      required: [title, projectId, tagIds, latestTaskId, count]
      properties:
        title:
          type: string
          description: 묶음에서 가장 최근에 만든 업무의 제목 (원래 표기 그대로)
        projectId:
          type: [string, 'null']
          format: uuid
          description: 대표 업무의 프로젝트. 없거나 보관한 프로젝트면 null
        tagIds:
          type: array
          items:
            type: string
            format: uuid
          description: 대표 업무의 태그
        latestTaskId:
          type: string
          format: uuid
          description: 대표 업무 ID (모바일 빠른 기록 SCR-MOB-01에서 기록을 붙일 업무)
        count:
          type: integer
          minimum: 2
          description: 집계 창 안의 사건 수

    Recurrence:
      type: object
      description: |
        반복 규칙 (SCH-03, SCR-CAL-07 ③). 저장은 RFC 5545 RRULE 문자열로 하고(FREQ·BYDAY·UNTIL·COUNT, INTERVAL=1), API는 이 형태로 주고받는다.
        첫 회차는 항상 일정의 시작이다. 그래서 매주는 weekdays에 시작일(일정 시간대)의 요일이 들어 있어야 한다(아니면 OUT_OF_RANGE).
        매월은 시작일과 같은 날짜이며, 그 날짜가 없는 달(예 31일)은 건너뛴다.
        회차 시각은 일정 시간대(timezone)의 벽시계 시각으로 유지한다(서머타임이 있는 시간대에서도 같은 현지 시각).
        until과 count는 함께 쓸 수 없다. 둘 다 없으면 끝없이 반복한다.
      required: [frequency]
      properties:
        frequency:
          type: string
          enum: [DAILY, WEEKLY, MONTHLY]
        weekdays:
          type: array
          description: WEEKLY에서만, 1개 이상 필수
          items:
            type: string
            enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]
        until:
          type: [string, 'null']
          format: date
          description: 이 날짜(일정 시간대)까지의 회차 포함. 시작일보다 앞서면 OUT_OF_RANGE
        count:
          type: [integer, 'null']
          minimum: 1
          maximum: 999
          description: 회차 수 (삭제한 회차도 센다)
    Schedule:
      type: object
      description: |
        일정 원본 (SCH-02). allDay=false면 startAt·endAt, true면 startDate·endDate(포함)가 값을 갖고 나머지 두 칸은 null이다.
      required: [id, title, allDay, timezone, createdAt, updatedAt, version]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        allDay:
          type: boolean
        startAt:
          type: [string, 'null']
          format: date-time
        endAt:
          type: [string, 'null']
          format: date-time
        startDate:
          type: [string, 'null']
          format: date
        endDate:
          type: [string, 'null']
          format: date
          description: 마지막 날 포함 (하루짜리 종일 일정은 startDate와 같다)
        timezone:
          type: string
          description: 반복 전개와 종일 날짜의 기준 IANA 시간대. 만들 때 사용자 시간대로 정해지며 바뀌지 않는다
          example: Asia/Seoul
        recurrence:
          oneOf:
            - $ref: '#/components/schemas/Recurrence'
            - type: 'null'
        taskId:
          type: [string, 'null']
          format: uuid
          description: 연결 업무 (SCR-CAL-07 ④). 프로젝트는 업무를 따른다
        memo:
          type: [string, 'null']
          maxLength: 5000
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
    ScheduleCreate:
      type: object
      required: [title, allDay]
      description: |
        allDay=false면 startAt·endAt 필수(endAt > startAt), true면 startDate·endDate 필수(endDate >= startDate).
        다른 종류의 두 칸은 보내지 않거나 null이어야 한다(아니면 INVALID_FORMAT). 제목은 앞뒤 공백을 빼고 저장한다.
        taskId는 보관하지 않은 내 업무여야 한다(아니면 NOT_FOUND). 15분 단위는 화면 조작 규칙이며 서버는 강제하지 않는다.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        allDay:
          type: boolean
        startAt:
          type: [string, 'null']
          format: date-time
        endAt:
          type: [string, 'null']
          format: date-time
        startDate:
          type: [string, 'null']
          format: date
        endDate:
          type: [string, 'null']
          format: date
        recurrence:
          oneOf:
            - $ref: '#/components/schemas/Recurrence'
            - type: 'null'
        taskId:
          type: [string, 'null']
          format: uuid
        memo:
          type: [string, 'null']
          maxLength: 5000
    SchedulePatch:
      type: object
      required: [version]
      description: 보낸 칸만 바꾼다. 검증 규칙은 ScheduleCreate와 같다(바꾼 뒤의 전체 값으로 검사).
      properties:
        version:
          type: integer
          format: int64
        title:
          type: string
          minLength: 1
          maxLength: 200
        allDay:
          type: boolean
        startAt:
          type: [string, 'null']
          format: date-time
        endAt:
          type: [string, 'null']
          format: date-time
        startDate:
          type: [string, 'null']
          format: date
        endDate:
          type: [string, 'null']
          format: date
        recurrence:
          oneOf:
            - $ref: '#/components/schemas/Recurrence'
            - type: 'null'
        taskId:
          type: [string, 'null']
          format: uuid
        memo:
          type: [string, 'null']
          maxLength: 5000
    OccurrencePatch:
      type: object
      required: [version]
      description: 보낸 칸만 바꾼다. memo에 null을 보내면 이 회차의 메모만 비운다.
      properties:
        version:
          type: integer
          format: int64
          description: 일정(Schedule)의 version
        title:
          type: string
          minLength: 1
          maxLength: 200
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        memo:
          type: [string, 'null']
          maxLength: 5000
    Occurrence:
      type: object
      description: |
        캘린더에 그리는 일정 회차 하나. 반복이 없는 일정도 회차 하나로 준다.
        occurrenceStart는 회차 키다: 원래(바꾸기 전) 시작 시각 — 종일 일정은 원래 시작일의 일정 시간대 0시.
        회차를 옮겨도 키는 바뀌지 않는다. 기록 연결(P2, WorkRecord)도 이 키를 쓴다.
      required: [scheduleId, occurrenceStart, recurring, modified, title, allDay, version]
      properties:
        scheduleId:
          type: string
          format: uuid
        occurrenceStart:
          type: string
          format: date-time
        recurring:
          type: boolean
          description: 반복 일정의 회차인지 (반복 아이콘, 수정 시 범위 선택 SCR-CAL-08)
        modified:
          type: boolean
          description: '"이 일정만"으로 바꾼 회차인지'
        title:
          type: string
        allDay:
          type: boolean
        startAt:
          type: [string, 'null']
          format: date-time
        endAt:
          type: [string, 'null']
          format: date-time
        startDate:
          type: [string, 'null']
          format: date
        endDate:
          type: [string, 'null']
          format: date
        taskId:
          type: [string, 'null']
          format: uuid
        projectId:
          type: [string, 'null']
          format: uuid
          description: |
            연결 업무의 프로젝트 (읽기 전용, 캘린더 프로젝트 필터·블록 색). 업무나 프로젝트가 없으면 null.
            보관한 업무도 그 프로젝트를 준다. (2026-10-06 추가)
        memo:
          type: [string, 'null']
        version:
          type: integer
          format: int64
          description: 일정(Schedule)의 version. 회차·전체 수정 모두 이 값을 보낸다

    WorkRecordStatus:
      type: string
      description: |
        확인 대기 / 확정 / 하지 않음 (REC-03). 확인 대기는 계획(일정 회차)에서 서버가 만든 후보이고,
        사용자 확인 없이 확정되지 않는다. 일지(P3)와 자주 하는 업무 집계(P2-04)는 CONFIRMED만 쓴다.
      enum: [PENDING, CONFIRMED, DISMISSED]
    WorkRecordOutcome:
      type: string
      description: 결과 칩 (REC-02, SCR-TASK-03 ②) — 완료 / 검토 요청 / 진행 중(진행률 n%)
      enum: [DONE, REVIEW_REQUESTED, IN_PROGRESS]
    WorkRecord:
      type: object
      description: |
        업무 기록 (REC-01, 요구사항 6장 WorkRecord). "무엇을 했고 결과가 어떤가".
        계획에서 온 기록은 scheduleId·occurrenceStart를 가진다(SCR-REC-01 ⑥ 출처 표시). 일정을 지우면 scheduleId는 null이 되고
        occurrenceStart는 남는다(출처 표시는 occurrenceStart로 판단).
        시간 칸(startAt·endAt·durationMin)은 시간 기록 옵션용이며 모두 null일 수 있다.
      required: [id, status, workDate, content, tagIds, createdAt, updatedAt, version]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/WorkRecordStatus'
        workDate:
          type: string
          format: date
          description: 귀속 날짜. 저장한 뒤 시간대를 바꿔도 바뀌지 않는다 (D-40)
        content:
          type: string
          minLength: 1
          maxLength: 500
          description: 한 일. 확인 대기 기록은 만들 때 회차 제목을 복사한다
        taskId:
          type: [string, 'null']
          format: uuid
          description: 연결 업무 (선택). 확인 대기 기록은 일정의 연결 업무를 복사한다. 업무를 보관해도 남는다
        scheduleId:
          type: [string, 'null']
          format: uuid
        occurrenceStart:
          type: [string, 'null']
          format: date-time
          description: 회차 키 (Occurrence.occurrenceStart, D-71). (scheduleId, occurrenceStart)는 유일하다
        result:
          type: [string, 'null']
          maxLength: 200
          description: 결과 한 줄 (REC-02)
        outcome:
          oneOf:
            - $ref: '#/components/schemas/WorkRecordOutcome'
            - type: 'null'
        progress:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          multipleOf: 10
          description: outcome=IN_PROGRESS일 때만 값이 있다
        startAt:
          type: [string, 'null']
          format: date-time
        endAt:
          type: [string, 'null']
          format: date-time
          description: startAt보다 늦다. startAt만 있고 endAt이 null이면 진행 중(타이머, P2-06)
        durationMin:
          type: [integer, 'null']
          minimum: 1
          maximum: 1440
          description: 소요시간(분). startAt·endAt이 있으면 서버가 계산하고, 둘 다 없을 때만 직접 넣는다
        tagIds:
          type: array
          items:
            type: string
            format: uuid
          description: 연결 업무의 태그 (읽기 전용, 일지·필터용). 업무가 없으면 빈 배열
        projectId:
          type: [string, 'null']
          format: uuid
          description: 연결 업무의 프로젝트 (읽기 전용, 블록 색·일지 묶음)
        deletedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
    WorkRecordCreate:
      type: object
      required: [content]
      description: |
        startAt이 없으면 workDate 필수(REQUIRED). endAt은 startAt 없이 보낼 수 없고 startAt보다 늦어야 한다(INVALID_ORDER).
        [P2-06] startAt을 보내면 endAt도 필수(endAt REQUIRED). 진행 중(endAt 없음) 기록은 타이머(/timer/start)만 만든다(동시 1개).
        PATCH도 같다: 끝난 기록의 endAt을 비울 수 없고, 실행 중인 타이머는 startAt·내용·업무를 고칠 수 있으며 endAt을 넣으면 정지와 같다.
        durationMin은 startAt과 함께 보낼 수 없다(INVALID_FORMAT). progress는 outcome=IN_PROGRESS일 때만(INVALID_FORMAT).
        taskId는 보관하지 않은 내 업무여야 한다(NOT_FOUND). 내용·결과는 앞뒤 공백을 빼고 저장한다(빈 결과는 null).
        다른 기록과 시간이 겹쳐도 저장한다(겹침 경고는 화면이 같은 날 목록으로 계산, TIME-06).
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 500
        workDate:
          type: [string, 'null']
          format: date
        taskId:
          type: [string, 'null']
          format: uuid
        result:
          type: [string, 'null']
          maxLength: 200
        outcome:
          oneOf:
            - $ref: '#/components/schemas/WorkRecordOutcome'
            - type: 'null'
        progress:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          multipleOf: 10
        startAt:
          type: [string, 'null']
          format: date-time
        endAt:
          type: [string, 'null']
          format: date-time
        durationMin:
          type: [integer, 'null']
          minimum: 1
          maximum: 1440
    PendingRecord:
      description: |
        확인 대기 목록의 항목 (P2-03). 기록 전체에 지금의 계획(회차)을 붙인다(SCR-HOME-02 ① 계획 시간).
        회차를 옮기거나 지우면 그 회차의 확인 대기는 지워지므로(P2-01) plan은 늘 있다.
      allOf:
        - $ref: '#/components/schemas/WorkRecord'
        - type: object
          required: [plan]
          properties:
            plan:
              type: object
              required: [title, allDay]
              description: 회차의 지금 값. 시간 일정은 startAt·endAt, 종일 일정은 startDate·endDate(포함)만 있다.
              properties:
                title:
                  type: string
                allDay:
                  type: boolean
                startAt:
                  type: string
                  format: date-time
                endAt:
                  type: string
                  format: date-time
                startDate:
                  type: string
                  format: date
                endDate:
                  type: string
                  format: date
    WorkRecordPatch:
      type: object
      required: [version]
      description: 보낸 칸만 바꾼다. 검증 규칙은 WorkRecordCreate와 같다(바꾼 뒤의 전체 값으로 검사). scheduleId·occurrenceStart는 바꿀 수 없다.
      properties:
        version:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/WorkRecordStatus'
        content:
          type: string
          minLength: 1
          maxLength: 500
        workDate:
          type: string
          format: date
          description: startAt이 있으면 무시한다(startAt으로 계산)
        taskId:
          type: [string, 'null']
          format: uuid
        result:
          type: [string, 'null']
          maxLength: 200
        outcome:
          oneOf:
            - $ref: '#/components/schemas/WorkRecordOutcome'
            - type: 'null'
        progress:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          multipleOf: 10
        startAt:
          type: [string, 'null']
          format: date-time
        endAt:
          type: [string, 'null']
          format: date-time
        durationMin:
          type: [integer, 'null']
          minimum: 1
          maximum: 1440

    # ───────── P2-06·P2-07 (2026-10-07 확정) ─────────
    TimerState:
      type: object
      required: [running]
      properties:
        running:
          oneOf:
            - $ref: '#/components/schemas/WorkRecord'
            - type: 'null'
    TimerStart:
      type: object
      description: |
        taskId·content·회차 키 중 하나 이상(REQUIRED). scheduleId와 occurrenceStart는 함께 보낸다(INVALID_FORMAT).
        taskId는 보관하지 않은 내 업무(NOT_FOUND). content는 앞뒤 공백을 뺀다.
      properties:
        taskId:
          type: [string, 'null']
          format: uuid
        content:
          type: [string, 'null']
          maxLength: 500
        scheduleId:
          type: [string, 'null']
          format: uuid
        occurrenceStart:
          type: [string, 'null']
          format: date-time
    TimerStopped:
      type: object
      required: [record, discarded, capped]
      properties:
        record:
          $ref: '#/components/schemas/WorkRecord'
        discarded:
          type: boolean
          description: 1분 미만이라 지웠다(record는 지운 기록의 마지막 값). 회차를 가져간 기록이면 확인 대기로 되돌렸다
        capped:
          type: boolean
          description: 24시간을 넘어 startAt+24시간으로 멈췄다
    PlanBlock:
      type: object
      description: 계획 회차 하나 (이어달리기 제안·빈 시간 후보). 시간 일정만.
      required: [scheduleId, occurrenceStart, title, startAt, endAt]
      properties:
        scheduleId:
          type: string
          format: uuid
        occurrenceStart:
          type: string
          format: date-time
          description: 회차 키 (D-71)
        title:
          type: string
        taskId:
          type: [string, 'null']
          format: uuid
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
    TimeSummary:
      type: object
      required: [from, to, totalMin, recordCount, projects, tasks]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        totalMin:
          type: integer
        recordCount:
          type: integer
        projects:
          type: array
          items:
            type: object
            required: [projectId, minutes]
            properties:
              projectId:
                type: [string, 'null']
                format: uuid
              minutes:
                type: integer
        tasks:
          type: array
          items:
            type: object
            required: [taskId, title, projectId, minutes]
            properties:
              taskId:
                type: [string, 'null']
                format: uuid
              title:
                type: [string, 'null']
                description: 업무의 지금 제목, 업무 없는 기록은 null. 일지 확정본은 확정 때 제목을 그대로 남긴다
              projectId:
                type: [string, 'null']
                format: uuid
              minutes:
                type: integer
    TimeGap:
      type: object
      required: [startAt, endAt, minutes, previous, plan, frequent]
      properties:
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        minutes:
          type: integer
          minimum: 15
        previous:
          description: 직전 업무 이어서
          oneOf:
            - type: object
              required: [content]
              properties:
                content:
                  type: string
                taskId:
                  type: [string, 'null']
                  format: uuid
            - type: 'null'
        plan:
          description: 이 시간 계획 업무. pendingRecordId가 있으면 새로 만들지 말고 그 기록을 PATCH한다
          oneOf:
            - allOf:
                - $ref: '#/components/schemas/PlanBlock'
                - type: object
                  properties:
                    pendingRecordId:
                      type: [string, 'null']
                      format: uuid
            - type: 'null'
        frequent:
          description: 자주 하는 업무 1위
          oneOf:
            - $ref: '#/components/schemas/FrequentTask'
            - type: 'null'

    LogType:
      type: string
      enum: [DAILY, WEEKLY, MONTHLY]
    LogStatus:
      type: string
      description: NO_RECORDS 기록 없음 / NOT_WRITTEN 미작성 / DRAFT 초안 / CONFIRMED 확정 (LOG-09)
      enum: [NO_RECORDS, NOT_WRITTEN, DRAFT, CONFIRMED]
    LogPeriod:
      type: object
      description: 일지 목록 한 줄 (SCR-LOG-01, SCR-HOME-01 ⑦)
      required: [type, periodStart, periodEnd, status, logId]
      properties:
        type:
          $ref: '#/components/schemas/LogType'
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
          description: 양끝 포함
        status:
          $ref: '#/components/schemas/LogStatus'
        logId:
          type: [string, 'null']
          format: uuid
        workday:
          type: boolean
          description: DAILY만. 근무일인지 (D-37). 휴일 = false
        holiday:
          type: [string, 'null']
          description: DAILY만. 공휴일 이름 (D-74), 아니면 null
        days:
          type: object
          description: WEEKLY·MONTHLY만. "확정 4/5일" 표시용 (SCR-LOG-01 ③)
          required: [workdays, confirmed]
          properties:
            workdays:
              type: integer
              description: 기간 안 근무일 수
            confirmed:
              type: integer
              description: 기간 안 일간 일지가 확정인 날 수 (비근무일 확정 포함)
    WorkLog:
      type: object
      description: 일지 (SCR-LOG-02). id=null이면 저장하지 않은 미리보기다.
      required: [id, type, periodStart, periodEnd, status, version, confirmedAt, sourceChangedAfterConfirm, content, planCandidates]
      properties:
        id:
          type: [string, 'null']
          format: uuid
        type:
          $ref: '#/components/schemas/LogType'
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/LogStatus'
        version:
          type: integer
          format: int64
          description: 미리보기는 0
        confirmedAt:
          type: [string, 'null']
          format: date-time
        sourceChangedAfterConfirm:
          type: boolean
          description: 확정 뒤 그 기간 원본(기록·업무)이 바뀌었으면 true — "원본이 바뀌었어요(확정 일지는 그대로)" 안내. 확정이 아니면 false
        content:
          $ref: '#/components/schemas/LogContent'
        planCandidates:
          type: array
          description: 계획 후보 칩 (LOG-03). 확정이면 빈 배열
          items:
            $ref: '#/components/schemas/PlanCandidate'
    LogContent:
      type: object
      description: 일지 문서 내용. 확정 스냅샷과 내보내기 파일이 이 모양을 그대로 쓴다.
      required: [title, author, achievementsAuto, achievements, metrics, planTitle, planPeriod, plans, issues, time, days, projects]
      properties:
        title:
          type: string
          description: 업무일지 / 주간 업무일지 / 월간 업무일지 (서식 명세)
        author:
          type: object
          description: 초안은 지금 프로필, 확정본은 확정 때 프로필. 빈 값은 null(문서에 빈칸)
          required: [name, organization, position]
          properties:
            name:
              type: [string, 'null']
            organization:
              type: [string, 'null']
            position:
              type: [string, 'null']
        achievementsAuto:
          type: boolean
          description: true면 실적을 원본에서 만들고 있다(아직 직접 고치지 않음). 확정본은 false
        achievements:
          type: array
          items:
            $ref: '#/components/schemas/LogAchievement'
        metrics:
          $ref: '#/components/schemas/LogMetrics'
        planTitle:
          type: string
          description: 다음 근무일 계획 / 다음 주 계획 / 다음 달 계획
        planPeriod:
          type: object
          required: [start, end]
          description: 계획 기간 (일간이면 다음 근무일 하루, 다음 주면 그 주)
          properties:
            start:
              type: string
              format: date
            end:
              type: string
              format: date
        plans:
          type: array
          items:
            $ref: '#/components/schemas/LogPlan'
        issues:
          type: [string, 'null']
          maxLength: 2000
        time:
          description: 시간 기록 옵션 켜짐일 때 소요시간 표 (TimeSummary와 같은 모양), 꺼져 있으면 null
          oneOf:
            - $ref: '#/components/schemas/TimeSummary'
            - type: 'null'
        days:
          type: array
          description: WEEKLY·MONTHLY만 (DAILY는 빈 배열). 날마다 출처 — 미확정 일 표시 (LOG-07, LOG-16)
          items:
            $ref: '#/components/schemas/LogDay'
        projects:
          type: array
          description: WEEKLY·MONTHLY만. 프로젝트별 실적 (LOG-08)
          items:
            $ref: '#/components/schemas/LogProjectStat'
    LogAchievement:
      type: object
      description: 실적 한 줄 (업무·결과·진행률, SCR-LOG-02 ②)
      required: [id, text, result, outcome, progress, taskId, projectName, dates, recordIds, durationMin, source]
      properties:
        id:
          type: string
          format: uuid
          description: 줄 식별자. 새 줄은 화면이 만든다(아무 UUID)
        text:
          type: string
          minLength: 1
          maxLength: 500
        result:
          type: [string, 'null']
          maxLength: 200
        outcome:
          oneOf:
            - $ref: '#/components/schemas/WorkRecordOutcome'
            - type: 'null'
        progress:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          multipleOf: 10
        taskId:
          type: [string, 'null']
          format: uuid
        projectName:
          type: [string, 'null']
          description: 연결 업무의 프로젝트 이름(서식 실적 "프로젝트" 열). 확정본은 그때 이름으로 고정
        dates:
          type: array
          description: 이 줄의 원본 기록이 있는 날(오름차순). 주간 서식 "한 날", 월간 서식 "기록 일수"(길이). 일간은 그날 하나
          items:
            type: string
            format: date
        recordIds:
          type: array
          description: 원본 기록 링크 (주간·월간은 묶인 기록 전부)
          items:
            type: string
            format: uuid
        durationMin:
          type: [integer, 'null']
          description: 서버가 recordIds로 계산해 넣는다(PATCH로 보낸 값은 무시). 옵션 꺼짐이면 null
        source:
          type: string
          description: RECORD 기록에서 / TASK 기록 없이 완료한 업무 / MANUAL 직접 쓴 줄
          enum: [RECORD, TASK, MANUAL]
    LogMetrics:
      type: object
      description: 진행 현황 자동 수치 (LOG-15). 초안은 늘 원본으로 계산
      required: [recordCount, completedTaskCount, done, reviewRequested, inProgress, pendingCount, totalMin]
      properties:
        recordCount:
          type: integer
          description: 확정 기록 수
        completedTaskCount:
          type: integer
          description: 기간 안에 완료한 업무 수
        done:
          type: integer
          description: |
            '완료' 건수. 일간·주간: 결과 '완료' 기록 수 + 완료한 날 그 업무의 기록이 없는 완료 업무 수(그날 '완료' 기록이 있는 업무는 한 번만, D-113).
            월간: 기간 안에 완료한 업무 수(D-123)
        reviewRequested:
          type: integer
        inProgress:
          type: integer
        pendingCount:
          type: integer
          description: 확인 대기 기록 수 (실적에서 뺀 개수)
        totalMin:
          type: [integer, 'null']
          description: 시간 기록 옵션 켜짐일 때 확정 소요시간 합, 꺼져 있으면 null
    LogPlan:
      type: object
      description: 계획 한 줄. dueDate·scheduledAt은 서버가 taskId로 채운다(PATCH로 보낸 값은 무시, 확정본은 그때 값으로 고정) — 서식 "예정" 칸
      required: [id, text, taskId, dueDate, scheduledAt]
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
          minLength: 1
          maxLength: 200
        taskId:
          type: [string, 'null']
          format: uuid
        dueDate:
          type: [string, 'null']
          format: date
          description: 연결 업무의 마감일
        scheduledAt:
          type: [string, 'null']
          format: date-time
          description: 계획 기간(planPeriod) 안에서 연결 업무의 가장 이른 시간 일정 회차 시작(취소 제외). 없으면 null
    PlanCandidate:
      type: object
      required: [taskId, title, status, dueDate, progress, reason]
      properties:
        taskId:
          type: string
          format: uuid
        title:
          type: string
        status:
          $ref: '#/components/schemas/TaskStatus'
        dueDate:
          type: [string, 'null']
          format: date
        progress:
          type: integer
        reason:
          type: string
          description: OVERDUE 마감 지남 / DUE 계획 기간 안 마감 / IN_PROGRESS 진행 중
          enum: [OVERDUE, DUE, IN_PROGRESS]
    LogDay:
      type: object
      required: [date, workday, holiday, source]
      properties:
        date:
          type: string
          format: date
        workday:
          type: boolean
        holiday:
          type: [string, 'null']
        source:
          type: string
          description: CONFIRMED_LOG 확정 일간 일지 / RECORDS 원본 기록(미확정 일) / NONE 원본 없음
          enum: [CONFIRMED_LOG, RECORDS, NONE]
    LogProjectStat:
      type: object
      required: [projectId, name, completedTaskCount, recordCount, minutes]
      properties:
        projectId:
          type: [string, 'null']
          format: uuid
          description: 프로젝트 없는 업무·업무 없는 기록은 null 한 줄
        name:
          type: [string, 'null']
        completedTaskCount:
          type: integer
        recordCount:
          type: integer
        minutes:
          type: [integer, 'null']
          description: 시간 기록 옵션 켜짐일 때만
    WorkLogPatch:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          format: int64
        achievements:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/LogAchievement'
        plans:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/LogPlan'
        issues:
          type: [string, 'null']
          maxLength: 2000
    VersionOnly:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          format: int64
    LogRevision:
      type: object
      required: [revisionNo, confirmedAt, unconfirmedAt]
      properties:
        revisionNo:
          type: integer
        confirmedAt:
          type: string
          format: date-time
        unconfirmedAt:
          type: [string, 'null']
          format: date-time
          description: 이 확정본을 해제한 시각. 지금 확정 상태면 null
    LogRevisionDetail:
      allOf:
        - $ref: '#/components/schemas/LogRevision'
        - type: object
          required: [content]
          properties:
            content:
              $ref: '#/components/schemas/LogContent'
    DailyClosePlan:
      type: object
      required: [date, log, pendingCount, carryOverCandidates, nextWorkday, planScope, suggestions]
      properties:
        date:
          type: string
          format: date
        log:
          $ref: '#/components/schemas/LogPeriod'
        pendingCount:
          type: integer
          description: 최근 7일 확인 대기 수 (GET /records/pending과 같은 범위)
        carryOverCandidates:
          type: array
          items:
            $ref: '#/components/schemas/CarryOverCandidate'
        nextWorkday:
          type: string
          format: date
        planScope:
          type: string
          enum: [NEXT_WORKDAY, NEXT_WEEK]
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/LogSuggestion'
    CarryOverCandidate:
      type: object
      required: [taskId, title, status, dueDate, progress, projectId, selected]
      properties:
        taskId:
          type: string
          format: uuid
        title:
          type: string
        status:
          $ref: '#/components/schemas/TaskStatus'
        dueDate:
          type: [string, 'null']
          format: date
        progress:
          type: integer
        projectId:
          type: [string, 'null']
          format: uuid
        selected:
          type: boolean
          description: 기본 선택 (LOG-14 — 늘 true)
    DailyCloseRequest:
      type: object
      required: [version, carryOverTaskIds]
      properties:
        version:
          type: integer
          format: int64
          description: 그날 일간 일지의 version, 없으면 0
        carryOverTaskIds:
          type: array
          maxItems: 50
          description: 계획으로 넘길 업무 (빈 배열 가능). 내 것이 아니거나 보관한 업무는 400(errors[].code=NOT_FOUND)
          items:
            type: string
            format: uuid
        issue:
          type: [string, 'null']
          maxLength: 500
          description: 이슈 한 줄 (비워 둘 수 있음)
    DailyCloseResult:
      type: object
      required: [log, suggestions]
      properties:
        log:
          $ref: '#/components/schemas/WorkLog'
        suggestions:
          type: array
          description: 주간 → 월간 순 (LOG-16). 해당 없으면 빈 배열
          items:
            $ref: '#/components/schemas/LogSuggestion'
    LogSuggestion:
      type: object
      required: [type, periodStart, periodEnd, logStatus, unconfirmedDates]
      properties:
        type:
          type: string
          enum: [WEEKLY, MONTHLY]
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        logStatus:
          $ref: '#/components/schemas/LogStatus'
        unconfirmedDates:
          type: array
          description: 기간 안 근무일 중 일간 일지가 확정이 아닌 날 ("미확정 일을 알려준다", LOG-16)
          items:
            type: string
            format: date
    Stats:
      type: object
      required: [from, to, completedTaskCount, recordCount, confirmedLogCount, daily, projects, firstRecordDate]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        completedTaskCount:
          type: integer
        recordCount:
          type: integer
        confirmedLogCount:
          type: integer
        daily:
          type: array
          items:
            type: object
            required: [date, completedTaskCount, recordCount]
            properties:
              date:
                type: string
                format: date
              completedTaskCount:
                type: integer
              recordCount:
                type: integer
        projects:
          type: array
          items:
            type: object
            required: [projectId, completedTaskCount, recordCount]
            properties:
              projectId:
                type: [string, 'null']
                format: uuid
              completedTaskCount:
                type: integer
              recordCount:
                type: integer
        firstRecordDate:
          type: [string, 'null']
          format: date
    PlanVsActual:
      type: object
      required: [from, to, weeks, topDiffs]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        weeks:
          type: array
          items:
            type: object
            required: [weekStart, plannedMin, actualMin, unplannedMin]
            properties:
              weekStart:
                type: string
                format: date
                description: 그 주의 시작일(기간 앞으로 나갈 수 있음)
              plannedMin:
                type: integer
              actualMin:
                type: integer
              unplannedMin:
                type: integer
        topDiffs:
          type: array
          maxItems: 5
          items:
            type: object
            required: [taskId, title, projectId, plannedMin, actualMin]
            properties:
              taskId:
                type: string
                format: uuid
              title:
                type: string
              projectId:
                type: [string, 'null']
                format: uuid
              plannedMin:
                type: integer
              actualMin:
                type: integer
    NotificationType:
      type: string
      enum: [DAILY_CLOSE, LOG_SUGGESTION]
      description: |
        DAILY_CLOSE 하루 마감 시간(이동: SCR-LOG-03, date), LOG_SUGGESTION 주간·월간 일지 만들 차례(이동: 그 일지, logType·periodStart).
    Notification:
      type: object
      required: [id, type, date, createdAt, readAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/NotificationType'
        date:
          type: string
          format: date
          description: 알림이 가리키는 날(하루 마감 대상일, 제안을 만든 날)
        pendingCount:
          type: [integer, 'null']
          description: DAILY_CLOSE일 때 보낼 때의 확인 대기 기록 수(스냅샷). 다른 종류는 null
        logType:
          type: [string, 'null']
          enum: [WEEKLY, MONTHLY, null]
          description: LOG_SUGGESTION일 때만
        periodStart:
          type: [string, 'null']
          format: date
          description: LOG_SUGGESTION일 때만
        createdAt:
          type: string
          format: date-time
        readAt:
          type: [string, 'null']
          format: date-time
    PushSubscription:
      type: object
      required: [endpoint, keys]
      properties:
        endpoint:
          type: string
          maxLength: 1000
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh:
              type: string
              maxLength: 200
            auth:
              type: string
              maxLength: 100
    Problem:
      type: object
      description: RFC 9457 Problem Details + 확장 필드 (P0-10 공통 모듈 형식)
      required: [type, title, status, code, traceId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: 기계 판독용 오류 코드
        errors:
          type: array
          items:
            type: object
            required: [field, code]
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
        traceId:
          type: string
