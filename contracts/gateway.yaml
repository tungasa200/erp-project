openapi: 3.1.0
info:
  title: api-gateway 공통 응답
  version: 0.2.0
  description: |
    Gateway가 내부 서비스로 넘기지 않고 직접 내는 응답의 계약이다. 모든 외부 경로(/api/**)에 공통으로 적용된다.
    P4 오류 수집 POST /api/client-errors (P4-13)와 점검 모드 환경변수 (P4-12)는 2026-10-10 확정(사용자 카드 20261011-0400).
    오류 본문은 RFC 9457 Problem Details + code·traceId (contracts/identity.yaml·worklog.yaml의 Problem과 같은 형식).
    모든 응답에는 응답 헤더 X-Trace-Id가 붙는다 (NFR-09).

    Gateway가 직접 내는 오류
    - 401 UNAUTHENTICATED: /api/users/me/**·/api/worklog/**에 유효한 access_token 쿠키가 없음 (만료·서명 오류·aud 불일치 포함)
    - 403 ORIGIN_REJECTED: 쓰기 요청(POST·PUT·PATCH·DELETE)의 Origin이 허용 목록에 없거나 없음 (NFR-02)
    - 404: 라우트가 없는 경로 (/internal/**, /.well-known/** 등)
    - 503 MAINTENANCE: 점검 중 (아래 /api/{path} 참고)

    점검 응답 (SCR-SYS-02 ②)
    - 구현은 P4-12. Gateway 환경변수로 켠다(Railway에서 값을 바꾸면 재배포되어 반영된다):
      MAINTENANCE_MODE=true면 점검. MAINTENANCE_UNTIL(선택, UTC ISO-8601 시각, 예 2026-11-01T06:30:00Z)이 있고 지금보다 뒤면
      Retry-After에 남은 초(올림)를 준다. 없거나 지났거나 해석할 수 없으면 Retry-After를 보내지 않는다(해석 실패는 기동 때 경고 로그 한 번).
    - 검사 순서: traceId → Vercel 비밀 헤더(틀리면 404, 직접 접근 차단은 점검 중에도 유지) → 점검(503) → Origin·인증.
      그래서 점검 중에는 로그인 여부·Origin과 관계없이 503이다.
    - 점검 중에는 /api/** 전체에 503 + code=MAINTENANCE를 준다. Gateway 자신의 /actuator/health는 예외다(배포 헬스체크용).
    - 프론트는 code=MAINTENANCE일 때만 점검 화면을 보여 준다. 본문이 Problem Details가 아니거나 code가 다른 502·503·504
      (Vercel 프록시나 Railway가 Gateway 장애 때 주는 응답)는 서버 오류·네트워크 화면으로 처리한다.
servers:
  - url: /
paths:
  /api/client-errors:
    post:
      operationId: reportClientError
      summary: 프론트엔드 오류 수집 (P4-13, NFR-09·D-35)
      description: |
        브라우저에서 잡힌 오류(window error, unhandledrejection, React 오류 경계)를 보낸다. Gateway가 직접 처리하며 내부 서비스로 넘기지 않는다.
        저장하지 않고 Gateway의 JSON 로그 한 줄(logger client-error, 수준 WARN)로 남긴다. 로그에는 이 요청의 traceId가 붙는다.
        - 인증: 필요 없음(로그인 전 화면 오류도 받는다). 쿠키가 있어도 읽지 않고 로그에 사용자 ID를 남기지 않는다.
        - 쓰기 요청이므로 Origin 검사(403 ORIGIN_REJECTED)와 Vercel 비밀 헤더 검사를 그대로 받는다. 점검 중에는 503이다.
        - 개인정보 빼기: 로그에 IP·쿠키·요청 헤더를 남기지 않는다. 서버가 url의 쿼리·프래그먼트(#…)를 지우고(재설정 링크 코드 등),
          message·stack에서 이메일 모양과 JWT 모양(eyJ로 시작하는 점 셋 구분 문자열)을 [email]·[token]으로 가린다.
          프론트는 입력값·토큰·응답 본문을 message에 넣지 않는다(오류 객체의 message와 stack만 보낸다).
        - 길이: 본문 16KB 초과는 413. 각 칸은 상한까지 자르고(400으로 거절하지 않음) 잘랐으면 로그에 truncated=true.
        - 요청 제한: 접속자 IP(X-Client-Ip, 없으면 한 묶음)당 1분에 10건, Gateway 전체 1분에 300건. 넘으면 429이고 로그에 남기지 않는다
          (넘긴 사실만 1분에 한 번 요약 로그). 인스턴스 메모리 안에서 세며 재시작하면 초기화된다.
        - 프론트는 같은 message+stack 첫 줄을 한 페이지 수명 동안 한 번만 보내고, 실패해도 다시 보내지 않는다(오류 수집이 오류를 만들지 않게).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientErrorReport'
      responses:
        '204':
          description: 받음 (로그에 남겼거나 가려서 남김)
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceId'
        '400':
          description: JSON이 아니거나 message가 없음 (code=VALIDATION_FAILED)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/OriginRejected'
        '413':
          description: 본문 16KB 초과 (code=PAYLOAD_TOO_LARGE)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: 요청 제한 초과 (code=TOO_MANY_REQUESTS, identity.yaml과 같은 이름). 프론트는 무시한다
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RateLimitedProblem'
        '503':
          $ref: '#/components/responses/Maintenance'
  /api/{path}:
    parameters:
      - name: path
        in: path
        required: true
        description: /api/ 아래 모든 경로
        schema:
          type: string
    get:
      operationId: gatewayCommonResponses
      summary: Gateway 공통 응답 (모든 메서드에 같음)
      security: [] # 인증 요구는 경로별로 다르다 (description 참고)
      responses:
        '200':
          description: 정상이면 내부 서비스 응답을 그대로 전달한다 (형식은 identity.yaml·worklog.yaml).
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OriginRejected'
        '503':
          $ref: '#/components/responses/Maintenance'
components:
  headers:
    XTraceId:
      description: 이 요청의 traceId. 오류 본문의 traceId와 같다.
      schema:
        type: string
    RetryAfter:
      description: 점검 종료 예상까지 남은 초 (선택). 예상 시각을 모르면 보내지 않는다.
      schema:
        type: integer
        minimum: 0
  responses:
    Unauthenticated:
      description: 유효한 access_token 쿠키 없음 (code=UNAUTHENTICATED). 프론트는 refresh 1회 후 재시도한다 (P0-07).
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/XTraceId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    OriginRejected:
      description: 쓰기 요청의 Origin이 허용 목록에 없거나 없음 (code=ORIGIN_REJECTED).
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/XTraceId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Maintenance:
      description: 점검 중 (code=MAINTENANCE). 구현은 P4-12.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/XTraceId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Service Unavailable
            status: 503
            detail: 서비스 점검 중입니다.
            code: MAINTENANCE
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
  schemas:
    ClientErrorReport:
      type: object
      required: [message]
      properties:
        kind:
          type: string
          enum: [ERROR, UNHANDLED_REJECTION, RENDER]
          description: window error / unhandledrejection / React 오류 경계. 없거나 모르는 값이면 ERROR로 남긴다
        message:
          type: string
          description: 오류 message. 500자에서 자른다
        stack:
          type: string
          description: 오류 stack. 4000자에서 자른다
        url:
          type: string
          description: 오류가 난 화면 주소. 서버가 쿼리·프래그먼트를 지우고 300자에서 자른다
        release:
          type: string
          description: 프론트 빌드 버전(커밋 해시 앞 7자 등). 40자에서 자른다
        relatedTraceId:
          type: string
          pattern: '^[0-9a-f]{16,32}$'
          description: 이 오류 직전에 실패한 API 응답의 traceId(있으면). 서버 로그와 잇는 데 쓴다. 형식이 다르면 버린다
      description: |
        User-Agent는 본문으로 받지 않고 요청 헤더에서 300자까지 로그에 남긴다.
        로그 칸: traceId, kind, message, stack, url, release, relatedTraceId, userAgent, truncated.
    RateLimitedProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [retryAfterSeconds]
          properties:
            retryAfterSeconds:
              type: integer
              description: 다시 보낼 수 있을 때까지 남은 초
    Problem:
      type: object
      description: RFC 9457 Problem Details + 확장 필드 (contracts/identity.yaml·worklog.yaml과 같음)
      required: [type, title, status, code, traceId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          description: 기계 판독용 오류 코드
        traceId:
          type: string
